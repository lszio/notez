name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen needs it for evil-janet)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (workspace)
        run: cargo build --workspace --all-targets

      - name: Test (workspace)
        run: cargo test --workspace

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen needs it for evil-janet)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install Rust toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The repo is not rustfmt-clean yet (starter packages + legacy
      # files), so report drift without failing the job. Flip to a hard
      # gate after a one-shot `cargo fmt --all` normalisation pass.
      - name: rustfmt (report only)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # Warnings are reported but do not fail the job yet; flip to
      # `-- -D warnings` once the existing warning backlog is cleared.
      - name: clippy
        run: cargo clippy --workspace --all-targets

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: notez-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (server responds)
        run: |
          docker run -d --name notez-web-smoke -p 3030:3030 notez-web:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3030/ > /dev/null; then
              echo "web server responded"
              docker rm -f notez-web-smoke
              exit 0
            fi
            sleep 2
          done
          echo "web server did not respond in time" >&2
          docker logs notez-web-smoke >&2 || true
          docker rm -f notez-web-smoke
          exit 1
