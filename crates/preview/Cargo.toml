[package]
name = "notez-preview"
version = "0.1.0"
edition = "2024"
description = "Notez preview catalog: format-specific SSR view-model builders (PDF, XLSX, PPTX, DOCX, images, code, embeds)"

[lib]
name = "notez_preview"
path = "src/lib.rs"

[dependencies]
notez-core     = { path = "../core" }
thiserror      = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
bytes          = "1"
lopdf          = "0"
calamine       = "0"
zip            = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml      = "0.36"
csv            = "1.3"
pulldown-cmark = "0.10"
ulid           = { workspace = true }
tempfile       = "3"