[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "notez command-line interface and embedded MCP stdio server"

[lib]
name = "notez_cli"
path = "src/lib.rs"

[[bin]]
name = "notez"
path = "src/main.rs"
[dependencies]
core       = { path = "../core" }
orgmode    = { path = "../adapters/orgmode" }
markdown   = { path = "../adapters/markdown" }
composition = { path = "../composition" }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
toml       = "1.1.3"
# rmcp re-exports `schemars` but the MCP server's DTOs need to refer to
# the `schemars::JsonSchema` trait directly. Pull the same version as
# the workspace pin (1.x) so types and impls align.
rmcp     = { version = "1.5", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
schemars = { workspace = true }
anyhow   = "1"
libc     = "0.2"

[features]
default = []
mcp     = [] # kept for documentation; the MCP server is always compiled.
web     = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }
rmcp       = { version = "1.5", default-features = false, features = [
    "server",
    "client",
    "macros",
    "transport-io",
] }
