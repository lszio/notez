[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "notez command-line interface and embedded MCP stdio server"

[lib]
name = "notez_cli"
path = "src/lib.rs"

[[bin]]
name = "notez"
path = "src/main.rs"
[dependencies]
notez-core = { path = "../core" }
notez-protocol = { path = "../protocol" }
notez-mcp = { path = "../mcp" }
markdown   = { path = "../adapters/markdown" }
composition = { path = "../composition" }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
notez-api  = { path = "../api" }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
toml       = "1.1.3"
anyhow   = "1"
libc     = "0.2"

[features]
default = []
mcp     = [] # kept for documentation; the MCP server is always compiled.
web     = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
