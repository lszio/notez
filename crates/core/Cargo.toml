[package]
name = "core"
version = "0.1.0"
edition = "2024"
description = "notez core: domain model, storage, document/source parsers, application services, preview catalog"

[lib]
name = "notez_core"
path = "src/lib.rs"

[dependencies]
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
ulid           = { workspace = true }
sha2           = "0.10"
walkdir        = { workspace = true }
rusqlite       = { workspace = true }
toml           = "0.8"
tempfile       = "3"
pulldown-cmark = "0.10"
lopdf          = "0"
calamine       = "0"
zip            = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml      = "0.36"
bytes          = "1"
notify         = "6"

[dev-dependencies]
orgmode  = { path = "../adapters/orgmode" }
markdown = { path = "../adapters/markdown" }
tempfile = "3"

# Note: the Cargo package name remains `core` (workspace and external
# identifiers), but the Rust library name is `notez_core` so that
# proc-macros that emit `::core::env`, `::core::convert`, and
# `schemars` schema paths resolve to the standard library instead of
# being shadowed by this crate. Consumers import the public surface
# as `notez_core::...`.
