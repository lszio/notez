[package]
name = "notez-mcp"
version = "0.1.0"
edition = "2024"
description = "notez MCP server: transport-agnostic rmcp handler mapping MCP tools to protocol requests"

[features]
default = []
# Streamable-HTTP serving for hosts that mount MCP beside web/api
# (packages/web). The stdio surface (cli) stays lean without axum.
http = ["dep:axum", "dep:tower", "rmcp/transport-streamable-http-server"]

[dependencies]
notez-core = { path = "../core" }
notez-protocol = { path = "../protocol" }
rmcp = { version = "1.8", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
[dev-dependencies]
tempfile = "3"
orgmode  = { path = "../adapters/orgmode" }
markdown = { path = "../adapters/markdown" }
rmcp = { version = "1.8", default-features = false, features = [
    "server",
    "client",
    "macros",
    "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
