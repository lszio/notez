[package]
name = "mcp"
version = "0.2.0"
edition = "2024"
description = "notez MCP stdio server (rmcp-based, MCP spec 2025-11-25)"

[dependencies]
domain = { path = "../domain" }
source = { path = "../source" }
storage = { path = "../storage" }
application = { path = "../application" }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "1.5", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }
anyhow = "1"
schemars = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }