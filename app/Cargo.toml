[package]
name = "app"
version = "0.1.0"
edition = "2024"
description = "notez dioxus application crate: shared root + platform entrypoints"

[lib]
name = "app"
path = "src/lib.rs"

[dependencies]
core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
dioxus = { version = "0.6", features = ["fullstack"] }
dioxus-web = { version = "0.6", optional = true, default-features = false }
dioxus-desktop = { version = "0.6", optional = true, default-features = false }
dioxus-mobile = { version = "0.6", optional = true, default-features = false }
urlencoding = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["target-web"]
target-web = ["dep:dioxus-web"]
target-desktop = ["dep:dioxus-desktop"]
target-mobile = ["dep:dioxus-mobile"]

[[bin]]
name = "notez-web"
path = "src/bin/web.rs"
required-features = ["target-web"]

[[bin]]
name = "notez-desktop"
path = "src/bin/desktop.rs"
required-features = ["target-desktop"]

[[bin]]
name = "notez-mobile"
path = "src/bin/mobile.rs"
required-features = ["target-mobile"]

[[bin]]
name = "notez-server"
path = "src/bin/server.rs"
