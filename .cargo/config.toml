[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg", 'getrandom_backend="wasm_js"',
    "--cfg", "wasm_bindgen_unstable_clone_ref",
    # Required by dioxus/web for full event support (oninput etc.);
    # without it hydrated listeners silently never fire.
    '--cfg', 'web_sys_unstable_Events',
]
