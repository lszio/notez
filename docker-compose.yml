# Notez web SSR server.
#
#   docker compose up -d
#   open http://localhost:3030
#
# The default mapping is loopback-only. To expose publicly, explicitly set
# NOTEZ_IP=0.0.0.0 and NOTEZ_WEB_TOKEN to a strong secret before starting.
# Public mutation routes reject requests without that token.
services:
  web:
    build: .
    image: notez-web:latest
    container_name: notez-web
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      IP: "${NOTEZ_IP:-127.0.0.1}"
      PORT: "3030"
      # Required by the middleware for non-loopback requests; optional for
      # the default loopback-only deployment.
      NOTEZ_WEB_TOKEN: "${NOTEZ_WEB_TOKEN:-}"
      # NOTEZ_SPACE_ROOT: /data/space
    volumes:
      - notez-data:/data
    restart: unless-stopped

volumes:
  notez-data:
