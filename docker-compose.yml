# Notez web SSR server.
#
#   docker compose up -d
#   open http://localhost:3030
#
# The default mapping is loopback-only (auth = anonymous). To expose
# publicly, set IP=0.0.0.0 plus NOTEZ_API_TOKEN or
# NOTEZ_API_OIDC_ISSUER + NOTEZ_API_OIDC_AUDIENCE — the server refuses
# public binds without auth (see crates/api/src/config.rs). For the
# dokploy/Traefik deployment with authentik see docker-compose.dokploy.yml.
services:
  web:
    build: .
    image: notez-web:latest
    container_name: notez-web
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      IP: "${IP:-127.0.0.1}"
      PORT: "3030"
      # Public binds require auth: set NOTEZ_API_TOKEN, or
      # NOTEZ_API_OIDC_ISSUER + NOTEZ_API_OIDC_AUDIENCE together.
      # NOTEZ_SPACE_ROOT: /data/space
    volumes:
      - notez-data:/data
    restart: unless-stopped

volumes:
  notez-data:
