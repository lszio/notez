[package]
name = "web"
version = "0.1.0"
edition = "2024"
description = "notez dioxus fullstack web client"

[lib]
name = "notez_web"
path = "src/lib.rs"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
notez-core = { path = "../../crates/core" }
notez-preview = { path = "../../crates/preview" }
composition = { path = "../../crates/composition" }
orgmode     = { path = "../../crates/adapters/orgmode" }
markdown    = { path = "../../crates/adapters/markdown" }
serde       = { workspace = true }
serde_json  = { workspace = true }
pulldown-cmark = { version = "0.10", default-features = false }
urlencoding = "2"
base64      = "0.22"
mime_guess  = "2.0"
html-escape = "0.2"
bytes       = "1.0"
ulid        = "1.0"
dioxus      = { workspace = true, features = ["router", "fullstack"] }

# Server-only stack (axum SSR host + custom API routes). Compiled out
# of the wasm client via the `server` feature gate.
axum    = { version = "0.8", features = ["form"], optional = true }
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
anyhow  = { version = "1", optional = true }
toml    = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus       = { workspace = true, features = ["web"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[features]
default = ["server"]
# Client build: dx passes --no-default-features --features web.
server = ["dioxus/server", "dep:axum", "dep:tokio", "dep:anyhow", "dep:toml"]
web    = ["dioxus/web"]

[dev-dependencies]
tempfile = "3"
