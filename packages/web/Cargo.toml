[package]
name = "web"
version = "0.1.0"
edition = "2024"
description = "notez dioxus fullstack web client (v0.1, reader-only)"

[lib]
name = "notez_web"
path = "src/lib.rs"

[dependencies]
core        = { path = "../../crates/core" }
orgmode     = { path = "../../crates/adapters/orgmode" }
markdown    = { path = "../../crates/adapters/markdown" }
serde       = { workspace = true }
serde_json  = { workspace = true }
axum        = { version = "0.8", features = ["form"] }
anyhow      = "1"
toml        = "0.8"
pulldown-cmark = { version = "0.10", default-features = false }
dioxus      = { workspace = true, features = ["router", "fullstack"] }
urlencoding = "2"
base64      = "0.22"
mime_guess  = "2.0"
html-escape = "0.2"
[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["rt-multi-thread", "macros"] }
[features]
# Default to the fullstack server (SSR + hydration). The `web` feature
# controls the WASM client bundle; `dx build --fullstack` builds both.
default = ["server"]
web     = ["dioxus/web"]
server  = ["dioxus/server"]
