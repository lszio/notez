[package]
name = "web"
version = "0.1.0"
edition = "2024"
description = "notez web surface: server-rendered workspace UI + protocol API + MCP host"

[lib]
name = "notez_web"
path = "src/lib.rs"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
notez-core = { path = "../../crates/core" }
notez-protocol = { path = "../../crates/protocol" }
notez-api = { path = "../../crates/api" }
notez-mcp = { path = "../../crates/mcp", features = ["http"] }
notez-preview = { path = "../../crates/preview" }
composition = { path = "../../crates/composition" }
orgmode = { path = "../../crates/adapters/orgmode" }
markdown = { path = "../../crates/adapters/markdown" }

serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
anyhow = "1"
toml = "0.8"
base64 = "0.22"
bytes = "1.0"
ulid = { workspace = true }
html-escape = "0.2"
mime_guess = "2.0"
sha2 = "0.10"
urlencoding = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
janetrs = "0.8"

[dev-dependencies]
tempfile = "3"
