[package]
name = "web"
version = "0.1.0"
edition = "2024"
description = "notez dioxus fullstack web client (v0.1, reader-only)"

[lib]
name = "notez_web"
path = "src/lib.rs"

[dependencies]
core        = { path = "../../crates/core" }
orgmode     = { path = "../../crates/adapters/orgmode" }
markdown    = { path = "../../crates/adapters/markdown" }
serde       = { workspace = true }
serde_json  = { workspace = true }
pulldown-cmark = { version = "0.10", default-features = false }
urlencoding = "2"
base64      = "0.22"
mime_guess  = "2.0"
html-escape = "0.2"
bytes       = "1.0"
ulid        = "1.0"
dioxus      = { workspace = true, features = ["router", "fullstack"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum    = { version = "0.8", features = ["form"] }
anyhow  = "1"
toml    = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus       = { workspace = true, features = ["router", "fullstack", "web"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["server"]
web     = ["dioxus/web", "dioxus/fullstack"]
server  = ["dioxus/server", "dioxus/fullstack"]
