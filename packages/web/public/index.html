<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notez</title>
  <script>
    (function () {
      // Restore the persisted theme BEFORE first paint so a dark-mode
      // user never sees a light flash.
      try {
        var stored = localStorage.getItem('notez-theme') || 'system';
        document.documentElement.dataset.theme = stored;
      } catch (e) {
        document.documentElement.dataset.theme = 'system';
      }
    })();
  </script>
  <script>
    (function () {
      // Theme control: Light / Dark / System cycle. The button's
      // visible label + aria-label always name the CURRENT mode
      // (never icon-only), and the change is instant with no reload.
      function current() {
        return document.documentElement.dataset.theme || 'system';
      }
      function syncToggle() {
        var t = current();
        document.querySelectorAll('[data-theme-toggle]').forEach(function (toggle) {
          toggle.setAttribute('aria-label', 'Theme: ' + t);
          toggle.title = 'Theme: ' + t + ' — click to change';
          var mode = toggle.querySelector('.theme-mode');
          if (mode) mode.textContent = t;
        });
      }
      document.addEventListener('click', function (event) {
        var toggle = event.target.closest && event.target.closest('[data-theme-toggle]');
        if (!toggle) return;
        var c = current();
        var next = c === 'light' ? 'dark' : c === 'dark' ? 'system' : 'light';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('notez-theme', next); } catch (e) {}
        syncToggle();
      });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncToggle);
      } else {
        syncToggle();
      }
    })();
  </script>
  <style>
    /* Paper-terminal palette.
     * The visual identity is "old notebook meets terminal": warm
     * paper ground, dark ink, a single muted accent (oxblood / seal
     * red) for emphasis. Everything is set in system serifs for
     * prose and a monospace stack for identifiers, paths, and
     * values — code, refs, properties all stay in monospace.
     *
     * No CSS framework, no rounded corners above 2px, no shadows.
     * Hierarchy is built from weight, size, and the hairlines
     * between sections, the way a printed page does it.
     */
    :root {
      --paper:        #f5f1e8;
      --paper-2:      #ebe5d6;
      --paper-edge:   #d8d0bd;
      --ink:          #1a1a1a;
      --ink-2:        #5a5a5a;
      --ink-3:        #8a8579;
      --ink-rule:     #c2b9a5;
      --accent:       #8b3a3a;
      --accent-soft:  #c89999;
      --warn:         #8b5a1a;
      --err:          #7a1a1a;

      --serif:  ui-serif, Georgia, "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", serif;
      --mono:   ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;

      --w-page:  78rem;
      --w-side:  18rem;
      --w-read:  44rem;

      /* PR6: three-column grid layout. Side panels stay at a fixed
       * pixel width so the centre column doesn't have to reflow as
       * the viewport grows. Centre content is capped at --col-main-max
       * and centred within the middle grid track so the prose never
       * gets wider than a comfortable reading measure. */
      --col-left-w:  320px;
      --col-right-w: 320px;
      --col-main-max: 960px;

      /* M6 design tokens: spacing / radius / elevation / status */
      --sp-1: 0.25rem; --sp-2: 0.5rem;  --sp-3: 0.75rem;
      --sp-4: 1rem;    --sp-5: 1.5rem;  --sp-6: 2rem;
      --r-sm: 3px;     --r-md: 6px;     --r-lg: 10px;
      --shadow-1: 0 1px 2px rgba(26, 26, 26, 0.08);
      --shadow-2: 0 4px 14px rgba(26, 26, 26, 0.12);
      --ok:   #3a6b35;
      --info: #1a4a7a;
    }

    /* Dark theme. Every rule reads the palette via var(), so
     * overriding tokens here re-themes the whole UI. Activated by
     * [data-theme="dark"] on <html>, or automatically when the OS
     * reports dark and no explicit [data-theme] is set. */
    [data-theme="dark"] {
      --paper:        #16130f;
      --paper-2:      #201b14;
      --paper-edge:   #2e2820;
      --ink:          #ece5d8;
      --ink-2:        #b8af9d;
      --ink-3:        #877f6e;
      --ink-rule:     #3f392d;
      --accent:       #d99292;
      --accent-soft:  #5a3232;
      --warn:         #d9ab63;
      --err:          #e29090;
      --ok:           #8fbf88;
      --info:         #8fb3d9;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.45);
      --shadow-2: 0 4px 14px rgba(0, 0, 0, 0.55);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --paper:        #16130f;
        --paper-2:      #201b14;
        --paper-edge:   #2e2820;
        --ink:          #ece5d8;
        --ink-2:        #b8af9d;
        --ink-3:        #877f6e;
        --ink-rule:     #3f392d;
        --accent:       #d99292;
        --accent-soft:  #5a3232;
        --warn:         #d9ab63;
        --err:          #e29090;
        --ok:           #8fbf88;
        --info:         #8fb3d9;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--paper); }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink-rule); }
    a:hover { border-bottom-color: var(--ink); }
    code, .mono, kbd, samp {
      font-family: var(--mono);
      font-size: 0.92em;
    }
    hr.rule { border: 0; border-top: 1px solid var(--ink-rule); margin: 0; }
    .div-dots {
      letter-spacing: 0.5em; color: var(--ink-3); user-select: none;
    }
    .page { padding: 1.5rem 2.25rem 3rem; min-width: 0; }
    .row.between { justify-content: space-between; }
    .col  { display: flex; flex-direction: column; }
    .muted { color: var(--ink-2); }
    .dim   { color: var(--ink-3); }
    .accent { color: var(--accent); }
    .err   { color: var(--err); }
    .mono-sm { font-family: var(--mono); font-size: 0.78rem; color: var(--ink-2); letter-spacing: 0.01em; }

    /* Old shell scaffolding — kept for backward compatibility with
     * pre-v0.2 renders (banner / sidebar fall-through). */
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .spine-inner {
      max-width: var(--w-page); margin: 0 auto;
      padding: 0.7rem 2.5rem;
      display: flex; align-items: center; gap: 1.5rem;
    }
    .brand {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      border-bottom: 2px solid var(--ink);
      padding-bottom: 1px;
    }
    .brand:hover { border-bottom-color: var(--accent); }
    .spine-meta {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-3);
      letter-spacing: 0.03em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spine-actions { display: flex; gap: 0.5rem; align-items: center; }
    .spine-action {
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-2);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.25rem 0.6rem;
      cursor: pointer;
    }
    .spine-action:hover { color: var(--ink); border-color: var(--ink); }
    .spine-action.accent { color: var(--accent); border-color: var(--accent-soft); }
    .spine-action.accent:hover { color: var(--accent); border-color: var(--accent); }
    .dashboard-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .dashboard-form { display: inline; margin: 0; padding: 0; }

    /* Old sidebar fallback (shown only on home). */
    .side {
      flex: 0 0 var(--w-side);
      border-right: 1px solid var(--ink-rule);
      background: var(--paper);
      padding: 1.25rem 1.25rem 2rem;
      overflow-y: auto;
      position: sticky;
      top: 0;
      max-height: 100vh;
    }
    .side-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .side-count { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-3); }
    .side-empty {
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-3); padding: 0.4rem 0.2rem;
      line-height: 1.5;
    }
    .side-list { list-style: none; padding: 0; margin: 0 0 1rem; }
    .side-item { display: block; }
    .side-link {
      display: block;
      padding: 0.45rem 0.55rem;
      border: 0;
      border-bottom: 1px dotted var(--ink-rule);
      text-decoration: none;
    }
    .side-link:hover { background: var(--paper-2); border-bottom-color: var(--paper-2); }
    .side-link.is-current { background: var(--ink); color: var(--paper); }
    .side-link.is-current:hover { background: var(--ink); }
    .side-link.is-current .side-link-path { color: var(--paper-2); }
    .side-link .side-link-name {
      display: block;
      font-family: var(--serif); font-size: 0.95rem; font-weight: 600;
      letter-spacing: 0.005em;
    }
    .side-link .side-link-path {
      display: block;
      font-family: var(--mono); font-size: 0.7rem;
      color: var(--ink-3);
      margin-top: 0.05rem;
      word-break: break-all;
      line-height: 1.35;
    }
    .side-link .side-tag {
      display: inline-block;
      font-family: var(--mono); font-size: 0.6rem;
      color: var(--paper-2);
      border: 1px solid var(--paper-2);
      padding: 0 0.3rem;
      margin-left: 0.4rem;
      letter-spacing: 0.05em;
      vertical-align: 0.15em;
    }
    .side-home-link {
      display: block; font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-2); border-bottom: 0; padding: 0.3rem 0.55rem;
    }
    .side-home-link:hover { color: var(--ink); border-bottom: 0; }
    .side-home-link.is-current { color: var(--ink); font-weight: 600; }

    .side-add {
      border-top: 1px solid var(--ink-rule);
      margin-top: 0.5rem;
      padding-top: 0.75rem;
    }
    .side-add > summary {
      list-style: none;
      cursor: pointer;
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-2);
      padding: 0.3rem 0;
      user-select: none;
    }
    .side-add > summary::-webkit-details-marker { display: none; }
    .side-add > summary::before {
      content: "▸";
      color: var(--ink-3); font-size: 0.7rem;
      margin-right: 0.4rem;
    }
    .side-add[open] > summary::before { content: "▾"; }
    .side-add > summary:hover { color: var(--ink); }
    .side-add-form { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
    .side-add-form label {
      font-family: var(--mono); font-size: 0.66rem;
      color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em;
    }
    .side-add-form input {
      font-family: var(--mono); font-size: 0.8rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.3rem 0.4rem;
    }
    .side-add-form input:focus { outline: none; border-color: var(--ink); }
    .side-add-form button {
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--paper); background: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      margin-top: 0.3rem;
    }

    @media (max-width: 60rem) {
      .side { --w-side: 14rem; }
      .side { flex: 0 0 14rem; }
    }
    @media (max-width: 44rem) {
      .shell-body { flex-direction: column; }
      .side { display: none; }
    }

    /* ----- Main column ----- */
    .main { flex: 1 1 auto; min-width: 0; }
    .main-inner { padding: 1.5rem 2rem 3rem; max-width: 100%; }

    /* ----- Banner (space error) ----- */
    .banner-err {
      background: var(--paper-2);
      border-bottom: 1px solid var(--ink-rule);
      padding: 0.5rem 0;
    }
    .banner-err-inner {
      padding: 0 2rem;
      font-family: var(--mono); font-size: 0.8rem;
      color: var(--err);
    }
    .banner-err-inner .label { color: var(--ink-2); margin-right: 0.5rem; }

    /* ----- Page heading ----- */
    .page-h {
      border-bottom: 1px solid var(--ink);
      padding-bottom: 0.6rem;
      margin-bottom: 1.25rem;
    }
    .page-h .eyebrow {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .page-h h1 {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      margin: 0.15rem 0 0;
      word-break: break-word;
    }
    .page-h .lede {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: var(--ink-2);
      margin-top: 0.4rem;
    }
    .page-h .lede .lede-stat { color: var(--ink); font-weight: 600; }

    /* ----- Controls row ----- */
    .controls {
      display: flex; align-items: center; gap: 0.75rem;
      flex-wrap: wrap;
      border-top: 1px solid var(--ink-rule);
      border-bottom: 1px solid var(--ink-rule);
      padding: 0.5rem 0;
      margin-bottom: 0.5rem;
    }
    .control { display: flex; align-items: center; gap: 0.4rem; }
    .control-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .control input, .control select {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--ink-rule);
      padding: 0.15rem 0.25rem;
    }
    .control input:focus, .control select:focus { outline: none; border-bottom-color: var(--ink); }
    .control .grow { flex: 1 1 14rem; }
    .control-spacer { flex: 1; }

    /* ----- Resource list ----- */
    .results-head {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.4rem 0 0.25rem;
      border-bottom: 1px solid var(--ink-rule);
    }
    .results-list { display: flex; flex-direction: column; }
    .result {
      display: block;
      padding: 0.7rem 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
    }
    .result:hover { background: var(--paper-2); }
    .result .result-head {
      display: flex; align-items: baseline; gap: 0.6rem;
    }
    .result .result-title {
      font-family: var(--serif); font-size: 1.05rem;
      color: var(--ink); line-height: 1.3;
    }
    .result .result-title a {
      color: var(--ink); border-bottom: 0;
    }
    .result .result-title a:hover { border-bottom: 1px solid var(--ink); }
    .result .result-meta {
      font-family: var(--mono); font-size: 0.72rem;
      color: var(--ink-3);
      margin-top: 0.18rem;
      display: flex; gap: 1rem; flex-wrap: wrap;
      word-break: break-all;
    }
    .result .result-meta .ref { color: var(--ink-2); }
    .result-empty {
      padding: 2rem 0.5rem; color: var(--ink-3); font-style: italic;
    }
    .result-empty .hint {
      color: var(--ink-2); font-style: normal;
      font-family: var(--mono); font-size: 0.78rem;
      margin-top: 0.4rem;
    }

    /* ----- Kind icon ----- */
    .kind {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--paper);
      background: var(--ink);
      display: inline-block;
      padding: 0.06rem 0.4rem;
      letter-spacing: 0.05em;
      min-width: 4.5rem; text-align: center;
      flex: 0 0 auto;
      transform: translateY(-0.05em);
    }
    .kind-document   { background: var(--ink); }
    .kind-heading    { background: var(--accent); }
    .kind-attachment { background: var(--warn); }
    .kind-block      { background: var(--ink-2); }

    /* ----- Breadcrumb ----- */
    .crumb {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-3);
      letter-spacing: 0.04em;
      margin-bottom: 0.8rem;
    }
    .crumb a { border-bottom: 0; color: var(--ink-2); }
    .crumb a:hover { color: var(--ink); border-bottom: 1px solid var(--ink); }
    .crumb .sep { color: var(--ink-3); padding: 0 0.35rem; }
    .crumb .here { color: var(--ink); }

    /* ----- Detail page ----- */
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2.5rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 60rem) {
      .detail-grid { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
    }
    .detail-side {
      border-left: 1px solid var(--ink-rule);
      padding-left: 1.5rem;
    }
    @media (max-width: 60rem) {
      .detail-side { border-left: 0; padding-left: 0; }
    }

    .detail-main { max-width: var(--w-read); }
    .detail-main h1 {
      font-family: var(--serif);
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.005em;
      margin: 0 0 0.4rem;
    }
    .detail-main .ref-line {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-3);
      margin-bottom: 1.5rem;
      word-break: break-all;
    }
    .detail-main .ref-line a { color: var(--ink-2); border-bottom: 0; }
    .detail-main .ref-line a:hover { color: var(--ink); border-bottom: 1px solid var(--ink); }
    .detail-body {
      font-family: var(--serif);
      font-size: 1.0rem;
      line-height: 1.7;
      margin: 1.2rem 0 1.5rem;
    }
    .detail-body h1, .detail-body h2, .detail-body h3, .detail-body h4 {
      font-family: var(--serif);
      font-weight: 600;
      margin: 1.6rem 0 0.6rem;
    }
    .detail-body h1 { font-size: 1.4rem; border-bottom: 1px solid var(--ink-rule); padding-bottom: 0.2rem; }
    .detail-body h2 { font-size: 1.2rem; }
    .detail-body h3 { font-size: 1.05rem; }
    .detail-body p { margin: 0.5rem 0 0.7rem; }
    .detail-body ul, .detail-body ol { margin: 0.4rem 0 0.8rem 1.5rem; }
    .detail-body li { margin: 0.15rem 0; }
    .detail-body code { font-family: var(--mono); font-size: 0.9em; background: var(--paper-2); padding: 0.05rem 0.3rem; border: 1px solid var(--ink-rule); }
    .detail-body pre { font-family: var(--mono); font-size: 0.86rem; background: var(--paper-2); border: 1px solid var(--ink-rule); padding: 0.8rem; overflow-x: auto; line-height: 1.5; }
    .detail-body pre code { background: transparent; border: 0; padding: 0; }
    .detail-body blockquote { border-left: 3px solid var(--ink-rule); margin: 0.5rem 0; padding: 0.2rem 0.8rem; color: var(--ink-2); }
    .detail-body a { color: var(--ink); }
    .detail-body hr { border: 0; border-top: 1px solid var(--ink-rule); margin: 1.5rem 0; }
    .detail-body table { border-collapse: collapse; margin: 0.5rem 0; }
    .detail-body th, .detail-body td { border: 1px solid var(--ink-rule); padding: 0.3rem 0.6rem; text-align: left; }
    .detail-body th { background: var(--paper-2); }
    .detail-main h2 {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      border-bottom: 1px solid var(--ink-rule);
      padding-bottom: 0.25rem;
    }
    .props {
      font-family: var(--mono);
      font-size: 0.82rem;
    }
    .props .row {
      display: grid;
      grid-template-columns: 9rem 1fr;
      gap: 0.8rem;
      padding: 0.35rem 0;
      border-bottom: 1px dotted var(--ink-rule);
    }
    .props .row .k {
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.7rem;
    }
    .props .row .v {
      color: var(--ink);
      word-break: break-all;
    }
    .props-empty {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--ink-3);
      font-style: italic;
      padding: 0.4rem 0;
    }

    /* Metadata drawer */
    .meta-drawer { margin: 0; }
    .meta-drawer > summary {
      list-style: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 0.3rem 0 0.5rem;
      user-select: none;
      border-bottom: 1px solid var(--ink-rule);
    }
    .meta-drawer > summary::-webkit-details-marker { display: none; }
    .meta-drawer > summary::before {
      content: "▸";
      color: var(--ink-3); font-size: 0.7rem;
      margin-right: 0.4rem;
    }
    .meta-drawer[open] > summary::before { content: "▾"; }
    .meta-drawer[open] > summary { color: var(--ink); border-bottom-color: var(--ink); }
    .meta-drawer-body { padding-top: 0.4rem; }
    .meta-list {
      font-family: var(--mono);
      font-size: 0.78rem;
    }
    .meta-list dt {
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.66rem;
      margin-top: 0.7rem;
    }
    .meta-list dt:first-child { margin-top: 0; }
    .meta-list dd {
      margin: 0.1rem 0 0;
      color: var(--ink);
      word-break: break-all;
    }
    .meta-list dd.muted { color: var(--ink-2); }

    /* Neighbor graph */
    .neighbor-graph { margin-top: 1rem; }
    .neighbor-graph .ng-svg {
      display: block;
      width: 100%; height: auto;
      max-height: 14rem;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
    }
    .neighbor-graph .ng-caption {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      letter-spacing: 0.05em;
      margin-top: 0.3rem;
    }
    .neighbor-graph .ng-link { stroke: var(--ink-rule); stroke-width: 1; fill: none; }
    .neighbor-graph .ng-link.is-active { stroke: var(--accent); }
    .neighbor-graph .ng-node { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
    .neighbor-graph .ng-node.is-focus { fill: var(--accent); stroke: var(--accent); }
    .neighbor-graph .ng-node.is-neighbor { fill: var(--paper); stroke: var(--ink); }
    .neighbor-graph .ng-label {
      font-family: var(--mono);
      font-size: 9px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
    }
    .neighbor-graph .ng-label.is-focus { fill: var(--paper); font-weight: 600; }

    /* Full-space graph page */
    .graph-page {
      display: grid;
      grid-template-columns: 18rem 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 60rem) {
      .graph-page { grid-template-columns: 1fr; }
    }
    .graph-controls {
      font-family: var(--mono); font-size: 0.78rem;
    }
    .graph-controls h2 {
      font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.18em;
      color: var(--ink-3); font-weight: 500;
      margin: 0 0 0.4rem;
    }
    .graph-controls .gc-stats {
      display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 0.6rem;
      margin-bottom: 1.2rem;
    }
    .graph-controls .gc-stats dt {
      color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em;
      font-size: 0.66rem;
    }
    .graph-controls .gc-stats dd { margin: 0; color: var(--ink); }
    .graph-controls .gc-legend {
      display: flex; flex-direction: column; gap: 0.25rem;
      margin-bottom: 1rem;
    }
    .graph-controls .gc-legend .swatch {
      display: inline-block; width: 0.8rem; height: 0.8rem;
      border: 1px solid var(--ink);
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    .graph-controls .gc-legend .swatch.is-doc { background: var(--ink); }
    .graph-controls .gc-legend .swatch.is-hd  { background: var(--accent); }
    .graph-controls .gc-legend .swatch.is-att { background: var(--warn); }
    .graph-controls .gc-legend .swatch.is-blk { background: var(--ink-2); }
    .graph-svg {
      display: block;
      width: 100%; height: auto;
      max-height: 78vh;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
    }
    .graph-link { stroke: var(--ink-rule); stroke-width: 0.6; fill: none; }
    .graph-link.is-active { stroke: var(--accent); stroke-width: 1.2; }
    .graph-node { stroke: var(--ink); stroke-width: 1; }
    .graph-node.is-doc { fill: var(--ink); }
    .graph-node.is-hd  { fill: var(--accent); }
    .graph-node.is-att { fill: var(--warn); }
    .graph-node.is-blk { fill: var(--ink-2); }
    .graph-label {
      font-family: var(--mono);
      font-size: 10px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
    }
    .graph-empty {
      padding: 4rem 0; text-align: center; color: var(--ink-3);
      font-style: italic;
    }

    /* Onboarding / home */
    .onboard {
      max-width: 40rem;
      margin: 2.5rem auto;
    }
    .onboard h1 {
      font-family: var(--serif);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
      border-bottom: 3px double var(--ink);
      padding-bottom: 0.5rem;
    }
    .onboard .lede {
      font-family: var(--serif);
      font-size: 1.05rem;
      color: var(--ink-2);
      margin-top: 1rem;
    }
    .onboard .steps {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0 0;
      counter-reset: step;
    }
    .onboard .steps li {
      counter-increment: step;
      padding: 0.5rem 0 0.5rem 2.25rem;
      position: relative;
      border-bottom: 1px dotted var(--ink-rule);
      font-family: var(--serif);
    }
    .onboard .steps li::before {
      content: counter(step, decimal-leading-zero);
      position: absolute; left: 0; top: 0.55rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
    }
    .onboard code {
      background: var(--paper-2);
      padding: 0.05rem 0.3rem;
      border: 1px solid var(--ink-rule);
    }

    /* Watch panel */
    .watch-panel {
      border-top: 1px solid var(--ink-rule);
      margin-top: 1.5rem;
      padding-top: 0.8rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .watch-panel .watch-label {
      font-family: var(--mono); font-size: 0.7rem;
      color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.15em;
    }
    .watch-panel .watch-state {
      font-family: var(--mono); font-size: 0.75rem; color: var(--ink-2);
    }
    .watch-panel .watch-state.is-on { color: var(--accent); }
    .watch-panel .watch-form { display: inline; }
    .watch-panel .watch-hint {
      font-family: var(--mono); font-size: 0.7rem; color: var(--ink-3);
      margin-left: auto;
    }

    /* Misc */
    .footer-rule {
      border-top: 1px solid var(--ink-rule);
      margin: 3rem 0 0;
      padding-top: 0.6rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      display: flex; gap: 1rem;
    }
    .err-text { color: var(--err); font-family: var(--mono); font-size: 0.85rem; }
    .skel { color: var(--ink-3); font-style: italic; font-family: var(--serif); }
    .preview-toolbar {
      display: flex; gap: 0.5rem;
      margin: 0.5rem 0 1rem;
      padding: 0.4rem 0;
      border-top: 1px dotted var(--ink-rule);
      border-bottom: 1px dotted var(--ink-rule);
    }
    .preview-toolbar .control-action {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.2rem 0.6rem;
      text-decoration: none;
    }
    .preview-toolbar .control-action:hover { color: var(--ink); border-color: var(--ink); }
    .preview-img img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .preview-pdf iframe { background: var(--paper-2); }
    .preview-text pre {
      max-height: 60vh;
      overflow: auto;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
      padding: 0.8rem;
    }

    /* ============================================================
     * v0.2 shell — top nav + 3-column body
     * ============================================================ */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--paper);
      border-bottom: 1px solid var(--ink-rule);
    }
    .topnav-inner {
      max-width: 100%;
      padding: 0.55rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .topnav-spacer { flex: 1; }
    .topnav-actions { display: flex; gap: 0.4rem; align-items: center; }
    .topnav-action, .topnav-form button {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.2rem 0.55rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      text-decoration: none;
      border-bottom: 1px solid var(--ink-rule);
    }
    .topnav-action:hover, .topnav-form button:hover {
      color: var(--ink);
      border-color: var(--ink);
    }
    .topnav-form { display: inline; margin: 0; padding: 0; }

    /* Space switcher dropdown */
    .space-switcher { position: relative; min-width: 0; max-width: 30rem; }
    .nav-space { position: relative; }
    .nav-space-summary {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--ink-rule);
      background: var(--paper);
      user-select: none;
      min-width: 0;
      max-width: 30rem;
    }
    .nav-space-summary::-webkit-details-marker { display: none; }
    .nav-space-summary::marker { content: ''; }
    .nav-space-mark { color: var(--accent); font-size: 0.95rem; line-height: 1; }
    .nav-space-name {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 0.95rem;
      max-width: 12rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-space-path {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      max-width: 14rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .nav-space-caret { color: var(--ink-3); font-size: 0.7rem; margin-left: 0.2rem; }
    .nav-space-panel {
      position: absolute;
      top: calc(100% + 0.3rem);
      left: 0;
      min-width: 24rem;
      max-width: 32rem;
      max-height: 30rem;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 0.6rem 0.8rem 0.8rem;
      z-index: 30;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .nav-space-head {
      display: flex; justify-content: space-between; align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.5rem;
    }
    .nav-space-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .nav-space-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
    }
    .nav-space-link {
      display: block;
      padding: 0.4rem 0.4rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--ink-2);
      border-bottom: 0;
    }
    .nav-space-link:hover { color: var(--ink); border-bottom: 0; background: var(--paper-2); }
    .nav-space-link.is-current { color: var(--ink); font-weight: 600; }

    /* Search trigger */
    .search-trigger { display: inline-flex; min-width: 18rem; flex: 1; max-width: 28rem; }
    .search-summary {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--ink-rule);
      background: var(--paper);
      flex: 1;
      max-width: 28rem;
      color: var(--ink-3);
      user-select: none;
    }
    .search-summary::-webkit-details-marker { display: none; }
    .search-summary::marker { content: ''; }
    .search-icon { color: var(--accent); font-size: 1rem; line-height: 1; }
    .search-label {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.01em;
      flex: 1;
      text-align: left;
    }
    .search-kbd {
      border: 1px solid var(--ink-rule);
      padding: 0.05rem 0.4rem;
      font-size: 0.7rem;
      color: var(--ink-2);
      letter-spacing: 0.05em;
    }

    /* 3-column body — PR6. Side tracks are fixed at --col-left-w /
     * --col-right-w. The centre track is `minmax(0, 1fr)` so it
     * shrinks when the viewport is narrow; page-level content
     * centres itself inside that track via .col-main > .page {
     * max-width: var(--col-main-max); margin: 0 auto; }.
     */
    .shell-body {
      flex: 1;
      display: grid;
      grid-template-columns: var(--col-left-w) minmax(0, 1fr) var(--col-right-w);
      min-height: 0;
    }
    .col-left, .col-right {
      border-right: 1px solid var(--ink-rule);
      background: var(--paper);
      overflow-y: auto;
      max-height: calc(100vh - 3rem);
      position: sticky;
      top: 3rem;
    }
    .col-right { border-right: 0; border-left: 1px solid var(--ink-rule); }
    .col-main { min-width: 0; }
    .col-main > .page { max-width: var(--col-main-max); margin: 0 auto; }
    .left-divider, .right-divider {
      border-top: 1px solid var(--ink-rule);
      margin: 0;
    }

    /* PR8 responsive tiers.
     *
     * Wide (default) : three columns, fixed 320px side rails.
     * ≤1100px (68.75rem) : hide the right rail (graph + props).
     *   The centre track + left rail remain. Two-column mode.
     * ≤900px (56.25rem) : tighten the left rail to 240px so the
     *   centre column doesn't get pinched below ~660px on iPad
     *   portrait. Files pill row still fits.
     * ≤720px (45rem) : single column. Hide both rails. Phone-only.
     */
    /* PR8 responsive tiers, UI-1 drawer behaviour.
     *
     * Wide (default): three columns, fixed 320px side rails.
     * Tablet (45rem – 68.75rem): left rail + main; the right rail
     *   (inspector: properties + graph) becomes a slide-in drawer
     *   opened by `.drawer-toggle-inspector`.
     * Mobile (≤ 45rem): single column; the left rail (tree + files)
     *   becomes a slide-in drawer opened by `.drawer-toggle-nav`.
     *
     * Drawers use `visibility` (with a transition delay) so their
     * links are not tabbable while closed. */
    @media (max-width: 68.75rem) {
      .shell-body {
        grid-template-columns: var(--col-left-w) minmax(0, 1fr);
      }
      .drawer-toggle.drawer-toggle-inspector { display: inline-flex; }
      .col-right {
        display: block;
        position: fixed;
        top: 3rem; right: 0; bottom: 0;
        width: min(20rem, 88vw);
        max-height: none;
        z-index: 60;
        background: var(--paper);
        border-left: 1px solid var(--ink-rule);
        border-right: 0;
        overflow-y: auto;
        transform: translateX(100%);
        visibility: hidden;
        transition: transform 0.18s ease-out, visibility 0s linear 0.18s;
      }
      .shell.inspector-open .col-right {
        transform: translateX(0);
        visibility: visible;
        transition: transform 0.18s ease-out;
        box-shadow: var(--shadow-2);
      }
    }
    @media (max-width: 56.25rem) {
      .shell-body {
        grid-template-columns: 15rem minmax(0, 1fr);
      }
      .files-pill-label { font-size: 0.62rem; }
      .files-pill-count { font-size: 0.6rem; }
    }
    @media (max-width: 45rem) {
      .shell-body {
        grid-template-columns: minmax(0, 1fr);
      }
      .drawer-toggle.drawer-toggle-nav { display: inline-flex; }
      .col-left {
        display: block;
        position: fixed;
        top: 3rem; left: 0; bottom: 0;
        width: min(18rem, 88vw);
        max-height: none;
        z-index: 60;
        background: var(--paper);
        border-right: 1px solid var(--ink-rule);
        overflow-y: auto;
        transform: translateX(-100%);
        visibility: hidden;
        transition: transform 0.18s ease-out, visibility 0s linear 0.18s;
      }
      .shell.nav-open .col-left {
        transform: translateX(0);
        visibility: visible;
        transition: transform 0.18s ease-out;
        box-shadow: var(--shadow-2);
      }
    }

    /* Tree panel (left top) */
    .tree-panel {
      padding: 1rem 1rem 1rem;
      max-height: 40vh;
      overflow-y: auto;
    }
    .tree-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.6rem;
    }
    .tree-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .tree-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
    }
    .tree-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
      padding: 0.5rem 0.2rem;
    }
    .tree-node { padding: 0.05rem 0; }
    .tree-node > summary {
      list-style: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink);
      padding: 0.18rem 0.3rem;
      display: flex;
      align-items: baseline;
      gap: 0.3rem;
      user-select: none;
    }
    .tree-node > summary::-webkit-details-marker { display: none; }
    .tree-node > summary::marker { content: ''; }
    .tree-marker { color: var(--ink-3); font-size: 0.7rem; width: 0.7rem; }
    .tree-name { font-family: var(--mono); font-weight: 600; color: var(--ink); }
    .tree-count-pill {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      margin-left: auto;
    }
    .tree-children { list-style: none; padding: 0 0 0 1rem; margin: 0; }
    .tree-leaf { list-style: none; }
    .tree-leaf-link {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.15rem 0.3rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      border-bottom: 1px dotted var(--ink-rule);
      text-decoration: none;
      word-break: break-all;
    }
    .tree-leaf-link:hover { color: var(--ink); background: var(--paper-2); }
    .tree-leaf-name { color: var(--ink); }
    .tree-leaf-kind { color: var(--ink-3); font-size: 0.7rem; }

    /* Files panel (left bottom) */
    .files-panel { padding: 0.8rem 1rem 1rem; }
    .files-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.5rem;
    }
    .files-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .files-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
    }
    .files-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
      padding: 0.5rem 0.2rem;
    }
    .files-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      padding: 0 1rem 0.6rem;
      border-bottom: 1px dotted var(--ink-rule);
      margin-bottom: 0.4rem;
    }
    .files-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 0.3rem;
      padding: 0.15rem 0.45rem;
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-2);
      border: 1px solid var(--ink-rule);
      border-radius: 2px;
      background: var(--paper-2);
    }
    .files-pill:hover { color: var(--ink); border-color: var(--ink); }
    .files-pill-count { color: var(--ink-3); }
    .files-pill-all { color: var(--ink); }
    .files-pill-md, .files-pill-org { border-color: var(--ink-2); }
    .files-pill-pdf, .files-pill-docx, .files-pill-pptx, .files-pill-xlsx { color: var(--accent); border-color: var(--accent-soft); }
    .files-pill-csv, .files-pill-tsv { color: var(--warn); border-color: var(--warn); }
    .files-list {
      list-style: none;
      padding: 0;
      margin: 0;
      /* PR8: long paths scroll horizontally inside the 320px
       * rail rather than overflowing the panel. */
      overflow-x: auto;
    }
    .files-row { padding: 0.05rem 0; }
    .files-link {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.25rem 0.3rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      border-bottom: 1px dotted var(--ink-rule);
      text-decoration: none;
      word-break: break-all;
    }
    .files-link:hover { color: var(--ink); background: var(--paper-2); }
    .files-ext {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--paper);
      background: var(--ink-2);
      padding: 0.05rem 0.3rem;
      letter-spacing: 0.05em;
      min-width: 3.5rem;
      text-align: center;
      flex: 0 0 auto;
    }
    .files-ext-attachment { background: var(--warn); }
    .files-name { flex: 1; }
    .files-size { color: var(--ink-3); font-size: 0.7rem; }
    .files-download, .files-jump { font-size: 0.7rem; color: var(--accent); }
    .files-download:hover, .files-jump:hover { color: var(--ink); }

    /* Properties panel (right top) */
    .props-panel { padding: 1rem; }
    .props-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.6rem;
    }
    .props-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .props-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
    }
    .props-detail { font-family: var(--mono); font-size: 0.82rem; }
    .props-title {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      word-break: break-word;
    }
    .props-ref {
      color: var(--ink-3);
      font-size: 0.74rem;
      margin-bottom: 0.6rem;
      word-break: break-all;
    }
    .props-meta { margin-bottom: 0.7rem; }
    .props-meta-row {
      display: grid;
      grid-template-columns: 5rem 1fr;
      gap: 0.4rem;
      padding: 0.15rem 0;
      border-bottom: 1px dotted var(--ink-rule);
    }
    .props-meta-k {
      color: var(--ink-3);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .props-meta-v { word-break: break-all; font-size: 0.78rem; }
    .props-section-title {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin: 0.5rem 0 0.4rem;
    }
    .props-list { margin: 0; padding: 0; }
    .props-list .props-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 0.4rem;
      padding: 0.18rem 0;
      border-bottom: 1px dotted var(--ink-rule);
      font-size: 0.78rem;
      word-break: break-word;
    }
    .props-list .props-row dt {
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.7rem;
    }
    .props-list .props-row dd { margin: 0; }
    .props-rollup-title {
      font-family: var(--serif);
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }

    /* Graph panel (right bottom) */
    .graph-panel { padding: 0.8rem 1rem 1rem; }
    .graph-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.5rem;
    }
    .graph-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .graph-count { color: var(--ink-3); }
    .graph-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
      padding: 0.5rem 0;
    }
    .np-svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
    }
    .np-link {
      stroke: var(--ink-rule);
      stroke-width: 0.8;
      fill: none;
    }
    .np-link.is-active { stroke: var(--accent); stroke-width: 1.4; }
    .np-node {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 1;
    }
    .np-node.is-focus { fill: var(--accent); stroke: var(--accent); }
    .np-node.is-neighbor { fill: var(--paper); stroke: var(--ink); }
    .np-label {
      font-family: var(--mono);
      font-size: 8px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
    }
    .np-label.is-focus { fill: var(--paper); font-weight: 600; }

    /* Command palette overlay */
    .palette-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      z-index: 100;
      justify-content: flex-start;
      align-items: flex-start;
      padding-top: 4rem;
    }
    .palette-overlay:target,
    .palette-overlay.is-open { display: flex; }
    .palette-modal {
      width: min(40rem, 90vw);
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--ink);
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
      max-height: 70vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .palette-prompt {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--ink-rule);
    }
    .palette-mark { color: var(--accent); font-size: 1.1rem; line-height: 1; }
    .palette-input {
      flex: 1;
      border: 0;
      background: transparent;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--ink);
      padding: 0.3rem 0;
    }
    .palette-input:focus { outline: none; }
    .palette-close {
      color: var(--ink-3);
      font-size: 0.7rem;
      border: 1px solid var(--ink-rule);
      padding: 0.05rem 0.4rem;
    }
    .palette-results { overflow-y: auto; padding: 0.4rem 0; }
    .palette-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      padding: 0.8rem 1rem;
    }
    .palette-list { list-style: none; padding: 0; margin: 0; }
    .palette-hit {
      border-bottom: 1px solid var(--ink-rule);
    }
    .palette-hit-link {
      display: block;
      padding: 0.55rem 1rem;
      color: var(--ink);
      border-bottom: 0;
    }
    .palette-hit-link:hover { background: var(--paper-2); border-bottom: 0; }
    .palette-hit-head {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.15rem;
    }
    .palette-hit-kind {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--paper);
      background: var(--ink);
      padding: 0.05rem 0.35rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .palette-hit-kind.kind-document { background: var(--ink); }
    .palette-hit-kind.kind-heading { background: var(--accent); }
    .palette-hit-kind.kind-attachment { background: var(--warn); }
    .palette-hit-kind.kind-block { background: var(--ink-2); }
    .palette-hit-title {
      font-family: var(--serif);
      font-size: 1rem;
      color: var(--ink);
    }
    .palette-hit-loc {
      color: var(--ink-3);
      margin-bottom: 0.15rem;
    }
    .palette-hit-snippet {
      color: var(--ink-2);
      font-style: italic;
    }

    /* Welcome page (per-space home) */
    .welcome-index {
      border-top: 1px solid var(--ink-rule);
      border-bottom: 1px solid var(--ink-rule);
      padding: 1.2rem 0;
      margin: 1rem 0;
    }
    .welcome-index-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.7rem;
      color: var(--ink-3);
    }
    .welcome-files {
      margin-top: 1.5rem;
      border-top: 1px solid var(--ink-rule);
      padding-top: 0.9rem;
    }
    .welcome-files-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
    }
    .welcome-files-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .welcome-files-link { color: var(--ink-2); border-bottom: 0; }
    .welcome-empty {
      padding: 1rem 1.2rem;
      border: 1px dashed var(--ink-rule);
      margin-bottom: 1.5rem;
      background: var(--paper-2);
    }
    .welcome-empty h2 { margin: 0 0 0.5rem; font-size: 1.1rem; }
    .welcome-empty-hints {
      margin: 0.6rem 0 0;
      padding-left: 1.1rem;
      color: var(--ink-2);
    }
    .welcome-files-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      padding: 0.5rem 0;
    }
    .welcome-files-list { list-style: none; padding: 0; margin: 0; }
    .welcome-files-row {
      border-bottom: 1px dotted var(--ink-rule);
    }
    .welcome-files-link2 {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.35rem 0.3rem;
      color: var(--ink-2);
      border-bottom: 0;
    }
    .welcome-files-link2:hover { color: var(--ink); background: var(--paper-2); }
    .welcome-files-ext {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--paper);
      background: var(--ink-2);
      padding: 0.05rem 0.4rem;
      letter-spacing: 0.05em;
      min-width: 3.5rem;
      text-align: center;
    }
    .welcome-files-ext.kind-attachment { background: var(--warn); }
    .welcome-files-name { flex: 1; font-family: var(--mono); font-size: 0.82rem; }
    .welcome-files-title { width: 40%; text-align: right; }
    .theme-toggle {
      display: inline-grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid var(--ink-rule);
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--ink-2);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 1rem;
      line-height: 1;
    }
    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      color: var(--ink);
      border-color: var(--accent);
    }
    .theme-toggle:focus-visible,
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Document source editing (textarea + actions) */
    .edit-source-textarea {
      width: 100%;
      min-height: 14rem;
      resize: vertical;
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
      border-radius: var(--r-sm);
      padding: 0.7rem 0.8rem;
    }
    .edit-source-textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .edit-source-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-top: 0.75rem;
    }
    .edit-source-save {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--paper);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--r-sm);
      padding: 0.35rem 0.9rem;
      cursor: pointer;
    }
    .edit-source-save:hover { filter: brightness(0.95); }
    .edit-source-cancel {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      border: 1px solid var(--ink-rule);
      border-radius: var(--r-sm);
      padding: 0.35rem 0.9rem;
      text-decoration: none;
    }
    /* Source coverage (list/query view) */
    .source-coverage {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: baseline;
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--ink-rule);
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--ink-2);
    }
    .source-coverage-label { color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
    .source-coverage-item { color: var(--ink-2); }
    .source-coverage-item.dim { color: var(--ink-3); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    .banner-err-kind {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--err);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid var(--err);
      border-radius: var(--r-sm);
      padding: 0.02rem 0.4rem;
    }

    .janet-panel {
      margin: 1.25rem 0;
      border: 1px solid var(--ink-rule);
      border-radius: var(--r-md);
      background: var(--paper);
    }
    .janet-panel > summary {
      cursor: pointer;
      padding: 0.5rem 0.9rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .janet-panel > summary:hover { color: var(--ink); }
    .janet-panel-body {
      border-top: 1px solid var(--ink-rule);
      padding: 0.9rem;
    }
    .janet-panel-hint { color: var(--ink-3); font-size: 0.78rem; margin: 0 0 0.6rem; }
    .janet-input {
      width: 100%;
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
      border-radius: var(--r-sm);
      padding: 0.6rem 0.7rem;
      resize: vertical;
    }
    .janet-input:focus-visible {
      outline: 2px solid var(--accent);
      border-color: var(--accent);
    }
    .janet-actions { margin-top: 0.6rem; }

    /* ============================================================
     * UI-1 document workbench — detail page
     * ============================================================ */
    .doc-header { margin-bottom: 0.5rem; }
    .doc-refline {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-3);
      margin: 0.15rem 0 0.7rem;
      word-break: break-all;
    }
    .doc-refline a { color: var(--ink-2); border-bottom: 0; }
    .doc-refline a:hover { color: var(--ink); border-bottom: 1px solid var(--ink); }
    .doc-status {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      margin: 0 0 1rem;
    }
    .doc-save-state {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--ink-2);
      letter-spacing: 0.02em;
    }
    .doc-save-state.is-dirty { color: var(--warn); }

    /* Save / conflict banners — text carries the state (never
     * colour alone) and each failure offers a next action. */
    .doc-banners {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .doc-banner {
      border: 1px solid var(--err);
      background: var(--paper-2);
      border-radius: var(--r-sm);
      padding: 0.55rem 0.8rem;
      font-family: var(--mono);
      font-size: 0.8rem;
    }
    .doc-banner-ok { border-color: var(--ok); }
    .doc-banner-ok .doc-banner-kind { color: var(--ok); }
    .doc-banner-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: baseline;
    }
    .doc-banner-kind {
      color: var(--err);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .doc-banner-msg { color: var(--ink-2); }
    .doc-banner-actions {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      margin-top: 0.45rem;
      flex-wrap: wrap;
    }
    .doc-banner-action {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--ink);
      border: 1px solid var(--ink-rule);
      border-radius: var(--r-sm);
      padding: 0.2rem 0.55rem;
      text-decoration: none;
    }
    .doc-banner-action:hover { border-color: var(--ink); }
    .doc-banner-note { color: var(--ink-3); font-size: 0.72rem; }

    /* Read / Edit / Source mode tabs — pure-CSS radio tabs. The
     * radios are visually hidden but stay in the tab order (arrow
     * keys switch mode); the active tab is styled via sibling
     * selectors. No JavaScript required. */
    .doc-modes { margin: 1rem 0 1.5rem; }
    .doc-mode-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .doc-mode-tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.9rem;
    }
    .doc-mode-tab {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--ink-2);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: var(--r-sm) var(--r-sm) 0 0;
      margin-bottom: -1px;
    }
    .doc-mode-tab:hover { color: var(--ink); }
    #doc-mode-read:checked ~ .doc-mode-tabs label[for="doc-mode-read"],
    #doc-mode-edit:checked ~ .doc-mode-tabs label[for="doc-mode-edit"],
    #doc-mode-source:checked ~ .doc-mode-tabs label[for="doc-mode-source"] {
      color: var(--ink);
      border-color: var(--ink-rule);
      border-bottom-color: var(--paper);
    }
    #doc-mode-read:focus-visible ~ .doc-mode-tabs label[for="doc-mode-read"],
    #doc-mode-edit:focus-visible ~ .doc-mode-tabs label[for="doc-mode-edit"],
    #doc-mode-source:focus-visible ~ .doc-mode-tabs label[for="doc-mode-source"] {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .doc-pane { display: none; }
    #doc-mode-read:checked ~ .doc-mode-panes .doc-pane-read { display: block; }
    #doc-mode-edit:checked ~ .doc-mode-panes .doc-pane-editor { display: block; }
    #doc-mode-source:checked ~ .doc-mode-panes .doc-pane-editor { display: block; }

    /* Editor chrome: Edit and Source share one textarea (draft-safe);
     * the mode only changes the header label + source locator. */
    .editor-chrome {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .editor-mode-label {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
    }
    .em-edit { display: inline; }
    .em-source { display: none; }
    #doc-mode-edit:checked ~ .doc-mode-panes .em-edit { display: inline; }
    #doc-mode-edit:checked ~ .doc-mode-panes .em-source { display: none; }
    #doc-mode-source:checked ~ .doc-mode-panes .em-edit { display: none; }
    #doc-mode-source:checked ~ .doc-mode-panes .em-source { display: inline; }
    .editor-source-locator { display: none; }
    #doc-mode-source:checked ~ .doc-mode-panes .editor-source-locator {
      display: inline;
      color: var(--ink-3);
    }
    .editor-save-row {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .editor-rev { color: var(--ink-3); }
    .editor-draft-note { color: var(--warn); }
    .readonly-note {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: var(--ink-2);
      margin: 1rem 0;
    }
    .readonly-note p { margin: 0.2rem 0; }

    /* ============================================================
     * UI-1 shell extras — drawer triggers, backdrop, status bar
     * ============================================================ */
    .drawer-toggle {
      display: none;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--ink-2);
      background: transparent;
      border: 1px solid var(--ink-rule);
      border-radius: var(--r-sm);
      padding: 0.3rem 0.55rem;
      cursor: pointer;
      min-height: 2rem;
    }
    .drawer-toggle:hover,
    .drawer-toggle[aria-expanded="true"] {
      color: var(--ink);
      border-color: var(--ink);
    }
    .drawer-toggle-mark { color: var(--accent); }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      top: 3rem;
      z-index: 55;
      background: rgba(0, 0, 0, 0.18);
      display: none;
    }
    .shell.nav-open .drawer-backdrop,
    .shell.inspector-open .drawer-backdrop { display: block; }

    .statusbar {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      border-top: 1px solid var(--ink-rule);
      padding: 0.3rem 1.5rem;
    }
    .statusbar-label {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .statusbar-value { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-2); }
    .statusbar-sep { color: var(--ink-3); }
    .statusbar-spacer { flex: 1; }
    .statusbar-path {
      color: var(--ink-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 40vw;
    }

    /* ============================================================
     * Home dashboard (Source health / Activity / Continue)
     * ============================================================ */
    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 56.25rem) {
      .home-grid { grid-template-columns: 1fr; }
    }
    .home-card { min-width: 0; }
    .home-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--ink-rule);
      padding-bottom: 0.4rem;
      margin-bottom: 0.7rem;
    }
    .home-card-head h2 {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
    }
    .home-card-count { color: var(--ink-3); }
    .home-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      margin: 0.2rem 0 0.5rem;
    }
    .home-steps {
      margin: 0.4rem 0 0;
      padding-left: 1.2rem;
      color: var(--ink-2);
    }
    .home-steps li { margin: 0.25rem 0; }
    .onboard-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .health-list {
      list-style: none;

    <!-- M6: hydrated Dioxus client. Served from /wasm/* by the

<body>
  <div id="main"></div>
<script>
/* M6 progressive enhancement: live list filtering that works with or
 * without a hydrated client. Filters rendered .result rows by their
 * visible text; updates the "showing x / y" counter if present.
 *
 * The filter stands down as soon as the Dioxus client mounts (its
 * nodes carry data-dioxus-id) — the Rust `oninput` signal then owns
 * the input, and this fallback would double-render. */
(function () {
  var mo = null;
  function clientMounted() {
    return !!(window.__dioxus || document.querySelector('#main [data-dioxus-id]'));
  }
  function stop() {
    if (mo) { mo.disconnect(); mo = null; }
  }
  function wire() {
    if (clientMounted()) { stop(); return; }
    const q = document.querySelector('input[name="q"]');
    if (!q || q.dataset.liveFilter) return;
    q.dataset.liveFilter = '1';
    const apply = function () {
      const needle = (q.value || '').trim().toLowerCase();
      const rows = document.querySelectorAll('.result');
      let shown = 0;
      rows.forEach(function (row) {
        const text = row.textContent.toLowerCase();
        const hit = !needle || text.indexOf(needle) !== -1;
        row.style.display = hit ? '' : 'none';
        if (hit) shown++;
      });
      document.querySelectorAll('.mono-sm').forEach(function (el) {
        if (/^\d+ \/ \d+$/.test(el.textContent.trim()) && rows.length) {
          el.textContent = shown + ' / ' + rows.length;
        }
      });
    };
    q.addEventListener('input', apply);
    q.addEventListener('change', apply);
    apply();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wire);
  } else { wire(); }
  // Re-wire after navigations render new lists; stop once the
  // Dioxus client takes over the DOM.
  if (!clientMounted()) {
    mo = new MutationObserver(function () { wire(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script>
/* M6/UI-1 progressive enhancement: command palette fallback.
 *
 * Runs only while the Dioxus client is NOT mounted (SSR-only build).
 * The corpus is the resource list rendered in the DOM (.result rows
 * on the list page), rebuilt as proper .palette-hit markup with a
 * kind badge, title and ref. Arrow keys move selection, Enter
 * navigates, Escape closes — keyboard flow works end to end.
 *
 * When the Dioxus client mounts (nodes carry data-dioxus-id) the
 * fallback stops: the Rust palette owns search + keyboard handling
 * and this script would double-render. */
(function () {
  var mo = null;
  function clientMounted() {
    return !!(window.__dioxus || document.querySelector('#main [data-dioxus-id]'));
  }
  function stop() {
    if (mo) { mo.disconnect(); mo = null; }
  }
  function corpus() {
    // Each .result row: the visible title link, kind class, ref text.
    return Array.from(document.querySelectorAll('.result')).map(function (row) {
      var titleEl = row.querySelector('.col-title a');
      var link = titleEl || row.querySelector('a[href]');
      var kindEl = row.querySelector('.kind');
      var kindMatch = kindEl && (kindEl.className.match(/kind-(\w+)/) || [])[1];
      var refEl = row.querySelector('.col-ref');
      return {
        href: link ? link.getAttribute('href') : null,
        title: titleEl ? (titleEl.textContent || '').trim() : (link ? (link.textContent || '').trim() : ''),
        kind: kindMatch || 'document',
        ref: refEl ? (refEl.textContent || '').trim() : ''
      };
    });
  }
  function visibleHits() {
    const needle = (input.value || '').trim().toLowerCase();
    return corpus().filter(function (h) {
      return h.href && (!needle || (h.title + ' ' + h.ref).toLowerCase().indexOf(needle) !== -1);
    });
  }
  var input = null;
  function render() {
    if (!input) return;
    const results = document.querySelector('.palette-results');
    if (!results) return;
    const hits = visibleHits();
    selected = Math.max(0, Math.min(selected, hits.length - 1));
    results.replaceChildren();
    if (!(input.value || '').trim()) {
      const empty = document.createElement('p');
      empty.className = 'palette-empty';
      empty.textContent = 'type to search this space.';
      results.append(empty);
      return;
    }
    if (!hits.length) {
      const empty = document.createElement('p');
      empty.className = 'palette-empty';
      empty.textContent = 'no matches.';
      results.append(empty);
      return;
    }
    const list = document.createElement('ul');
    list.className = 'palette-list';
    hits.forEach(function (hit, index) {
      const item = document.createElement('li');
      item.className = index === selected ? 'palette-hit palette-hit-selected' : 'palette-hit';
      const a = document.createElement('a');
      a.className = 'palette-hit-link';
      a.href = hit.href;
      const head = document.createElement('div');
      head.className = 'palette-hit-head';
      const kind = document.createElement('span');
      kind.className = 'palette-hit-kind kind-' + hit.kind;
      kind.textContent = hit.kind;
      const title = document.createElement('span');
      title.className = 'palette-hit-title';
      title.textContent = hit.title;
      head.append(kind, title);
      const loc = document.createElement('div');
      loc.className = 'palette-hit-loc mono-sm';
      loc.textContent = hit.ref;
      a.append(head, loc);
      item.append(a);
      list.append(item);
    });
    results.append(list);
  }
  var selected = 0;
  function wirePalette() {
    if (clientMounted()) { stop(); return; }
    input = document.querySelector('.palette-input');
    if (!input || input.dataset.livePalette) return;
    input.dataset.livePalette = '1';
    input.addEventListener('input', function () { selected = 0; render(); });
    input.addEventListener('keydown', function (event) {
      const hits = visibleHits();
      if (event.key === 'ArrowDown' && hits.length) {
        event.preventDefault(); selected = (selected + 1) % hits.length; render();
      } else if (event.key === 'ArrowUp' && hits.length) {
        event.preventDefault(); selected = (selected + hits.length - 1) % hits.length; render();
      } else if (event.key === 'Enter') {
        if (hits[selected] && hits[selected].href) {
          event.preventDefault();
          window.location.href = hits[selected].href;
        }
      } else if (event.key === 'Escape') {
        const close = document.querySelector('.palette-close');
        if (close) close.click();
      }
    });
    render();
  }

  wirePalette();
  if (!clientMounted()) {
    mo = new MutationObserver(function () { wirePalette(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script>
/* UI-1: responsive drawer toggles (tablet inspector / mobile nav).
 * Delegated so SSR-only pages work; aria-expanded stays in sync.
 * Escape and backdrop click close; links inside a drawer close it
 * after the native navigation has been triggered. */
(function () {
  var shell = null;
  function getShell() {
    if (shell && document.body.contains(shell)) return shell;
    shell = document.querySelector('.shell');
    return shell;
  }
  function isOpen(cls) {
    var s = getShell();
    return !!s && s.classList.contains(cls);
  }
  function setDrawer(kind, open) {
    var s = getShell();
    if (!s) return;
    var cls = kind === 'nav' ? 'nav-open' : 'inspector-open';
    if (open) s.classList.add(cls); else s.classList.remove(cls);
    var btn = document.querySelector('.drawer-toggle-' + kind);
    if (btn) {
      var label = (kind === 'nav' ? 'navigation' : 'inspector');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', (open ? 'Close ' : 'Open ') + label);
    }
  }
  function closeDrawers() {
    setDrawer('nav', false);
    setDrawer('inspector', false);
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    var navBtn = t.closest && t.closest('.drawer-toggle-nav');
    if (navBtn) { e.preventDefault(); setDrawer('nav', !isOpen('nav-open')); return; }
    var inspBtn = t.closest && t.closest('.drawer-toggle-inspector');
    if (inspBtn) { e.preventDefault(); setDrawer('inspector', !isOpen('inspector-open')); return; }
    if (t.closest && t.closest('.drawer-backdrop')) { closeDrawers(); return; }
    if (t.closest && t.closest('a')) {
      var a = t.closest('a');
      if (a.closest('.col-left') || a.closest('.col-right')) { closeDrawers(); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawers();
  });
})();
</script>
<script>
/* UI-1: document editor draft + save state (SSR-only fallback).
 *
 * - The draft textarea value is mirrored to sessionStorage keyed by
 *   ref_str on every input and on submit.
 * - After a failed save (redirect carries `edit_err`), the draft is
 *   restored into the textarea and the save state reads "Unsaved
 *   changes"; the stale-revision banner explains the conflict.
 * - After a successful save (`edited=1`) the draft is cleared.
 * - The visible save state is text ("Saved" / "Unsaved changes"),
 *   never colour alone, and updates both the header and the editor.
 *
 * Stands down when the Dioxus client mounts (data-dioxus-id) — the
 * Rust handlers then own the editor state. */
(function () {
  var mo = null;
  function clientMounted() {
    return !!(window.__dioxus || document.querySelector('#main [data-dioxus-id]'));
  }
  function stop() {
    if (mo) { mo.disconnect(); mo = null; }
  }
  function draftKey(ref) { return 'notez-draft:' + ref; }
  function syncSaveState(form) {
    if (!form) return;
    var ta = form.querySelector('textarea[name="content"]');
    var dirty = ta && ta.value !== ta.defaultValue;
    document.querySelectorAll('[data-save-state]').forEach(function (el) {
      el.textContent = dirty ? 'Unsaved changes' : 'Saved';
      el.classList.toggle('is-dirty', dirty);
    });
    var note = form.querySelector('.editor-draft-note');
    if (note) note.hidden = !dirty;
  }
  function wireEditor() {
    if (clientMounted()) { stop(); return; }
    var form = document.querySelector('.doc-edit-form');
    if (!form || form.dataset.editorWired) return;
    form.dataset.editorWired = '1';
    var ta = form.querySelector('textarea[name="content"]');
    var key = form.getAttribute('data-draft-key') || '';
    var params = new URLSearchParams(window.location.search);
    var draft = null;
    try { draft = sessionStorage.getItem(draftKey(key)); } catch (e) {}
    if (params.get('edit_err') && draft) {
      ta.value = draft;
      var note = form.querySelector('.editor-draft-note');
      if (note) { note.textContent = 'draft restored — review before saving'; note.hidden = false; }
    } else if (params.get('edited') === '1') {
      try { sessionStorage.removeItem(draftKey(key)); } catch (e) {}
    }
    ta.addEventListener('input', function () {
      try { sessionStorage.setItem(draftKey(key), ta.value); } catch (e) {}
      syncSaveState(form);
    });
    form.addEventListener('submit', function () {
      try { sessionStorage.setItem(draftKey(key), ta.value); } catch (e) {}
    });
    syncSaveState(form);
  }
  function wireModes() {
    if (clientMounted()) return;
    var modes = document.querySelector('.doc-modes');
    if (!modes || modes.dataset.modesWired) return;
    modes.dataset.modesWired = '1';
    modes.querySelectorAll('.doc-mode-tab').forEach(function (label) {
      label.addEventListener('click', function () {
        var id = label.getAttribute('for');
        var ta = modes.querySelector('textarea[name="content"]');
        if (ta && (id === 'doc-mode-edit' || id === 'doc-mode-source')) {
          // Keyboard users land directly in the editor.
          setTimeout(function () { ta.focus(); }, 0);
        }
      });
    });
  }
  function wireAll() {
    wireEditor();
    wireModes();
  }
  wireAll();
  if (!clientMounted()) {
    mo = new MutationObserver(function () { wireAll(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
