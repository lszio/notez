<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notez</title>
  <style>
    /* Paper-terminal palette.
     * The visual identity is "old notebook meets terminal": warm
     * paper ground, dark ink, a single muted accent (oxblood / seal
     * red) for emphasis. Everything is set in system serifs for
     * prose and a monospace stack for identifiers, paths, and
     * values — code, refs, properties all stay in monospace.
     *
     * No CSS framework, no rounded corners above 2px, no shadows.
     * Hierarchy is built from weight, size, and the hairlines
     * between sections, the way a printed page does it.
     */
    :root {
      --paper:        #f5f1e8;
      --paper-2:      #ebe5d6;
      --paper-edge:   #d8d0bd;
      --ink:          #1a1a1a;
      --ink-2:        #5a5a5a;
      --ink-3:        #8a8579;
      --ink-rule:     #c2b9a5;
      --accent:       #8b3a3a;
      --accent-soft:  #c89999;
      --warn:         #8b5a1a;
      --err:          #7a1a1a;

      --serif:  ui-serif, Georgia, "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", serif;
      --mono:   ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;

      --w-page:  78rem;
      --w-side:  18rem;
      --w-read:  44rem;

      /* PR6: three-column grid layout. Side panels stay at a fixed
       * pixel width so the centre column doesn't have to reflow as
       * the viewport grows. Centre content is capped at --col-main-max
       * and centred within the middle grid track so the prose never
       * gets wider than a comfortable reading measure. */
      --col-left-w:  320px;
      --col-right-w: 320px;
      --col-main-max: 960px;

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--paper); }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink-rule); }
    a:hover { border-bottom-color: var(--ink); }
    code, .mono, kbd, samp {
      font-family: var(--mono);
      font-size: 0.92em;
    }
    hr.rule { border: 0; border-top: 1px solid var(--ink-rule); margin: 0; }
    .div-dots {
      letter-spacing: 0.5em; color: var(--ink-3); user-select: none;
    }
    .page { padding: 1.5rem 2.25rem 3rem; min-width: 0; }
    .row.between { justify-content: space-between; }
    .col  { display: flex; flex-direction: column; }
    .muted { color: var(--ink-2); }
    .dim   { color: var(--ink-3); }
    .accent { color: var(--accent); }
    .err   { color: var(--err); }
    .mono-sm { font-family: var(--mono); font-size: 0.78rem; color: var(--ink-2); letter-spacing: 0.01em; }

    /* Old shell scaffolding — kept for backward compatibility with
     * pre-v0.2 renders (banner / sidebar fall-through). */
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .spine-inner {
      max-width: var(--w-page); margin: 0 auto;
      padding: 0.7rem 2.5rem;
      display: flex; align-items: center; gap: 1.5rem;
    }
    .brand {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      border-bottom: 2px solid var(--ink);
      padding-bottom: 1px;
    }
    .brand:hover { border-bottom-color: var(--accent); }
    .spine-meta {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-3);
      letter-spacing: 0.03em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spine-actions { display: flex; gap: 0.5rem; align-items: center; }
    .spine-action {
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-2);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.25rem 0.6rem;
      cursor: pointer;
    }
    .spine-action:hover { color: var(--ink); border-color: var(--ink); }
    .spine-action.accent { color: var(--accent); border-color: var(--accent-soft); }
    .spine-action.accent:hover { color: var(--accent); border-color: var(--accent); }
    .dashboard-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .dashboard-form { display: inline; margin: 0; padding: 0; }

    /* Old sidebar fallback (shown only on home). */
    .side {
      flex: 0 0 var(--w-side);
      border-right: 1px solid var(--ink-rule);
      background: var(--paper);
      padding: 1.25rem 1.25rem 2rem;
      overflow-y: auto;
      position: sticky;
      top: 0;
      max-height: 100vh;
    }
    .side-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .side-count { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-3); }
    .side-empty {
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-3); padding: 0.4rem 0.2rem;
      line-height: 1.5;
    }
    .side-list { list-style: none; padding: 0; margin: 0 0 1rem; }
    .side-item { display: block; }
    .side-link {
      display: block;
      padding: 0.45rem 0.55rem;
      border: 0;
      border-bottom: 1px dotted var(--ink-rule);
      text-decoration: none;
    }
    .side-link:hover { background: var(--paper-2); border-bottom-color: var(--paper-2); }
    .side-link.is-current { background: var(--ink); color: var(--paper); }
    .side-link.is-current:hover { background: var(--ink); }
    .side-link.is-current .side-link-path { color: var(--paper-2); }
    .side-link .side-link-name {
      display: block;
      font-family: var(--serif); font-size: 0.95rem; font-weight: 600;
      letter-spacing: 0.005em;
    }
    .side-link .side-link-path {
      display: block;
      font-family: var(--mono); font-size: 0.7rem;
      color: var(--ink-3);
      margin-top: 0.05rem;
      word-break: break-all;
      line-height: 1.35;
    }
    .side-link .side-tag {
      display: inline-block;
      font-family: var(--mono); font-size: 0.6rem;
      color: var(--paper-2);
      border: 1px solid var(--paper-2);
      padding: 0 0.3rem;
      margin-left: 0.4rem;
      letter-spacing: 0.05em;
      vertical-align: 0.15em;
    }
    .side-home-link {
      display: block; font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-2); border-bottom: 0; padding: 0.3rem 0.55rem;
    }
    .side-home-link:hover { color: var(--ink); border-bottom: 0; }
    .side-home-link.is-current { color: var(--ink); font-weight: 600; }

    .side-add {
      border-top: 1px solid var(--ink-rule);
      margin-top: 0.5rem;
      padding-top: 0.75rem;
    }
    .side-add > summary {
      list-style: none;
      cursor: pointer;
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--ink-2);
      padding: 0.3rem 0;
      user-select: none;
    }
    .side-add > summary::-webkit-details-marker { display: none; }
    .side-add > summary::before {
      content: "▸";
      color: var(--ink-3); font-size: 0.7rem;
      margin-right: 0.4rem;
    }
    .side-add[open] > summary::before { content: "▾"; }
    .side-add > summary:hover { color: var(--ink); }
    .side-add-form { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
    .side-add-form label {
      font-family: var(--mono); font-size: 0.66rem;
      color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em;
    }
    .side-add-form input {
      font-family: var(--mono); font-size: 0.8rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.3rem 0.4rem;
    }
    .side-add-form input:focus { outline: none; border-color: var(--ink); }
    .side-add-form button {
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--paper); background: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      margin-top: 0.3rem;
    }

    @media (max-width: 60rem) {
      .side { --w-side: 14rem; }
      .side { flex: 0 0 14rem; }
    }
    @media (max-width: 44rem) {
      .shell-body { flex-direction: column; }
      .side { display: none; }
    }

    /* ----- Main column ----- */
    .main { flex: 1 1 auto; min-width: 0; }
    .main-inner { padding: 1.5rem 2rem 3rem; max-width: 100%; }

    /* ----- Banner (space error) ----- */
    .banner-err {
      background: var(--paper-2);
      border-bottom: 1px solid var(--ink-rule);
      padding: 0.5rem 0;
    }
    .banner-err-inner {
      padding: 0 2rem;
      font-family: var(--mono); font-size: 0.8rem;
      color: var(--err);
    }
    .banner-err-inner .label { color: var(--ink-2); margin-right: 0.5rem; }

    /* ----- Page heading ----- */
    .page-h {
      border-bottom: 1px solid var(--ink);
      padding-bottom: 0.6rem;
      margin-bottom: 1.25rem;
    }
    .page-h .eyebrow {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .page-h h1 {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      margin: 0.15rem 0 0;
      word-break: break-word;
    }
    .page-h .lede {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: var(--ink-2);
      margin-top: 0.4rem;
    }
    .page-h .lede .lede-stat { color: var(--ink); font-weight: 600; }

    /* ----- Controls row ----- */
    .controls {
      display: flex; align-items: center; gap: 0.75rem;
      flex-wrap: wrap;
      border-top: 1px solid var(--ink-rule);
      border-bottom: 1px solid var(--ink-rule);
      padding: 0.5rem 0;
      margin-bottom: 0.5rem;
    }
    .control { display: flex; align-items: center; gap: 0.4rem; }
    .control-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .control input, .control select {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--ink-rule);
      padding: 0.15rem 0.25rem;
    }
    .control input:focus, .control select:focus { outline: none; border-bottom-color: var(--ink); }
    .control .grow { flex: 1 1 14rem; }
    .control-spacer { flex: 1; }

    /* ----- Resource list ----- */
    .results-head {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.4rem 0 0.25rem;
      border-bottom: 1px solid var(--ink-rule);
    }
    .results-list { display: flex; flex-direction: column; }
    .result {
      display: block;
      padding: 0.7rem 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
    }
    .result:hover { background: var(--paper-2); }
    .result .result-head {
      display: flex; align-items: baseline; gap: 0.6rem;
    }
    .result .result-title {
      font-family: var(--serif); font-size: 1.05rem;
      color: var(--ink); line-height: 1.3;
    }
    .result .result-title a {
      color: var(--ink); border-bottom: 0;
    }
    .result .result-title a:hover { border-bottom: 1px solid var(--ink); }
    .result .result-meta {
      font-family: var(--mono); font-size: 0.72rem;
      color: var(--ink-3);
      margin-top: 0.18rem;
      display: flex; gap: 1rem; flex-wrap: wrap;
      word-break: break-all;
    }
    .result .result-meta .ref { color: var(--ink-2); }
    .result-empty {
      padding: 2rem 0.5rem; color: var(--ink-3); font-style: italic;
    }
    .result-empty .hint {
      color: var(--ink-2); font-style: normal;
      font-family: var(--mono); font-size: 0.78rem;
      margin-top: 0.4rem;
    }

    /* ----- Kind icon ----- */
    .kind {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--paper);
      background: var(--ink);
      display: inline-block;
      padding: 0.06rem 0.4rem;
      letter-spacing: 0.05em;
      min-width: 4.5rem; text-align: center;
      flex: 0 0 auto;
      transform: translateY(-0.05em);
    }
    .kind-document   { background: var(--ink); }
    .kind-heading    { background: var(--accent); }
    .kind-attachment { background: var(--warn); }
    .kind-block      { background: var(--ink-2); }

    /* ----- Breadcrumb ----- */
    .crumb {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-3);
      letter-spacing: 0.04em;
      margin-bottom: 0.8rem;
    }
    .crumb a { border-bottom: 0; color: var(--ink-2); }
    .crumb a:hover { color: var(--ink); border-bottom: 1px solid var(--ink); }
    .crumb .sep { color: var(--ink-3); padding: 0 0.35rem; }
    .crumb .here { color: var(--ink); }

    /* ----- Detail page ----- */
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2.5rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 60rem) {
      .detail-grid { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
    }
    .detail-side {
      border-left: 1px solid var(--ink-rule);
      padding-left: 1.5rem;
    }
    @media (max-width: 60rem) {
      .detail-side { border-left: 0; padding-left: 0; }
    }

    .detail-main { max-width: var(--w-read); }
    .detail-main h1 {
      font-family: var(--serif);
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.005em;
      margin: 0 0 0.4rem;
    }
    .detail-main .ref-line {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-3);
      margin-bottom: 1.5rem;
      word-break: break-all;
    }
    .detail-main .ref-line a { color: var(--ink-2); border-bottom: 0; }
    .detail-main .ref-line a:hover { color: var(--ink); border-bottom: 1px solid var(--ink); }
    .detail-body {
      font-family: var(--serif);
      font-size: 1.0rem;
      line-height: 1.7;
      margin: 1.2rem 0 1.5rem;
    }
    .detail-body h1, .detail-body h2, .detail-body h3, .detail-body h4 {
      font-family: var(--serif);
      font-weight: 600;
      margin: 1.6rem 0 0.6rem;
    }
    .detail-body h1 { font-size: 1.4rem; border-bottom: 1px solid var(--ink-rule); padding-bottom: 0.2rem; }
    .detail-body h2 { font-size: 1.2rem; }
    .detail-body h3 { font-size: 1.05rem; }
    .detail-body p { margin: 0.5rem 0 0.7rem; }
    .detail-body ul, .detail-body ol { margin: 0.4rem 0 0.8rem 1.5rem; }
    .detail-body li { margin: 0.15rem 0; }
    .detail-body code { font-family: var(--mono); font-size: 0.9em; background: var(--paper-2); padding: 0.05rem 0.3rem; border: 1px solid var(--ink-rule); }
    .detail-body pre { font-family: var(--mono); font-size: 0.86rem; background: var(--paper-2); border: 1px solid var(--ink-rule); padding: 0.8rem; overflow-x: auto; line-height: 1.5; }
    .detail-body pre code { background: transparent; border: 0; padding: 0; }
    .detail-body blockquote { border-left: 3px solid var(--ink-rule); margin: 0.5rem 0; padding: 0.2rem 0.8rem; color: var(--ink-2); }
    .detail-body a { color: var(--ink); }
    .detail-body hr { border: 0; border-top: 1px solid var(--ink-rule); margin: 1.5rem 0; }
    .detail-body table { border-collapse: collapse; margin: 0.5rem 0; }
    .detail-body th, .detail-body td { border: 1px solid var(--ink-rule); padding: 0.3rem 0.6rem; text-align: left; }
    .detail-body th { background: var(--paper-2); }
    .detail-main h2 {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      border-bottom: 1px solid var(--ink-rule);
      padding-bottom: 0.25rem;
    }
    .props {
      font-family: var(--mono);
      font-size: 0.82rem;
    }
    .props .row {
      display: grid;
      grid-template-columns: 9rem 1fr;
      gap: 0.8rem;
      padding: 0.35rem 0;
      border-bottom: 1px dotted var(--ink-rule);
    }
    .props .row .k {
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.7rem;
    }
    .props .row .v {
      color: var(--ink);
      word-break: break-all;
    }
    .props-empty {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--ink-3);
      font-style: italic;
      padding: 0.4rem 0;
    }

    /* Metadata drawer */
    .meta-drawer { margin: 0; }
    .meta-drawer > summary {
      list-style: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 0.3rem 0 0.5rem;
      user-select: none;
      border-bottom: 1px solid var(--ink-rule);
    }
    .meta-drawer > summary::-webkit-details-marker { display: none; }
    .meta-drawer > summary::before {
      content: "▸";
      color: var(--ink-3); font-size: 0.7rem;
      margin-right: 0.4rem;
    }
    .meta-drawer[open] > summary::before { content: "▾"; }
    .meta-drawer[open] > summary { color: var(--ink); border-bottom-color: var(--ink); }
    .meta-drawer-body { padding-top: 0.4rem; }
    .meta-list {
      font-family: var(--mono);
      font-size: 0.78rem;
    }
    .meta-list dt {
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.66rem;
      margin-top: 0.7rem;
    }
    .meta-list dt:first-child { margin-top: 0; }
    .meta-list dd {
      margin: 0.1rem 0 0;
      color: var(--ink);
      word-break: break-all;
    }
    .meta-list dd.muted { color: var(--ink-2); }

    /* Neighbor graph */
    .neighbor-graph { margin-top: 1rem; }
    .neighbor-graph .ng-svg {
      display: block;
      width: 100%; height: auto;
      max-height: 14rem;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
    }
    .neighbor-graph .ng-caption {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      letter-spacing: 0.05em;
      margin-top: 0.3rem;
    }
    .neighbor-graph .ng-link { stroke: var(--ink-rule); stroke-width: 1; fill: none; }
    .neighbor-graph .ng-link.is-active { stroke: var(--accent); }
    .neighbor-graph .ng-node { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
    .neighbor-graph .ng-node.is-focus { fill: var(--accent); stroke: var(--accent); }
    .neighbor-graph .ng-node.is-neighbor { fill: var(--paper); stroke: var(--ink); }
    .neighbor-graph .ng-label {
      font-family: var(--mono);
      font-size: 9px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
    }
    .neighbor-graph .ng-label.is-focus { fill: var(--paper); font-weight: 600; }

    /* Full-space graph page */
    .graph-page {
      display: grid;
      grid-template-columns: 18rem 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 60rem) {
      .graph-page { grid-template-columns: 1fr; }
    }
    .graph-controls {
      font-family: var(--mono); font-size: 0.78rem;
    }
    .graph-controls h2 {
      font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.18em;
      color: var(--ink-3); font-weight: 500;
      margin: 0 0 0.4rem;
    }
    .graph-controls .gc-stats {
      display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 0.6rem;
      margin-bottom: 1.2rem;
    }
    .graph-controls .gc-stats dt {
      color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em;
      font-size: 0.66rem;
    }
    .graph-controls .gc-stats dd { margin: 0; color: var(--ink); }
    .graph-controls .gc-legend {
      display: flex; flex-direction: column; gap: 0.25rem;
      margin-bottom: 1rem;
    }
    .graph-controls .gc-legend .swatch {
      display: inline-block; width: 0.8rem; height: 0.8rem;
      border: 1px solid var(--ink);
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    .graph-controls .gc-legend .swatch.is-doc { background: var(--ink); }
    .graph-controls .gc-legend .swatch.is-hd  { background: var(--accent); }
    .graph-controls .gc-legend .swatch.is-att { background: var(--warn); }
    .graph-controls .gc-legend .swatch.is-blk { background: var(--ink-2); }
    .graph-svg {
      display: block;
      width: 100%; height: auto;
      max-height: 78vh;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
    }
    .graph-link { stroke: var(--ink-rule); stroke-width: 0.6; fill: none; }
    .graph-link.is-active { stroke: var(--accent); stroke-width: 1.2; }
    .graph-node { stroke: var(--ink); stroke-width: 1; }
    .graph-node.is-doc { fill: var(--ink); }
    .graph-node.is-hd  { fill: var(--accent); }
    .graph-node.is-att { fill: var(--warn); }
    .graph-node.is-blk { fill: var(--ink-2); }
    .graph-label {
      font-family: var(--mono);
      font-size: 10px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
    }
    .graph-empty {
      padding: 4rem 0; text-align: center; color: var(--ink-3);
      font-style: italic;
    }

    /* Onboarding / home */
    .onboard {
      max-width: 40rem;
      margin: 2.5rem auto;
    }
    .onboard h1 {
      font-family: var(--serif);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
      border-bottom: 3px double var(--ink);
      padding-bottom: 0.5rem;
    }
    .onboard .lede {
      font-family: var(--serif);
      font-size: 1.05rem;
      color: var(--ink-2);
      margin-top: 1rem;
    }
    .onboard .steps {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0 0;
      counter-reset: step;
    }
    .onboard .steps li {
      counter-increment: step;
      padding: 0.5rem 0 0.5rem 2.25rem;
      position: relative;
      border-bottom: 1px dotted var(--ink-rule);
      font-family: var(--serif);
    }
    .onboard .steps li::before {
      content: counter(step, decimal-leading-zero);
      position: absolute; left: 0; top: 0.55rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
    }
    .onboard code {
      background: var(--paper-2);
      padding: 0.05rem 0.3rem;
      border: 1px solid var(--ink-rule);
    }

    /* Watch panel */
    .watch-panel {
      border-top: 1px solid var(--ink-rule);
      margin-top: 1.5rem;
      padding-top: 0.8rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .watch-panel .watch-label {
      font-family: var(--mono); font-size: 0.7rem;
      color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.15em;
    }
    .watch-panel .watch-state {
      font-family: var(--mono); font-size: 0.75rem; color: var(--ink-2);
    }
    .watch-panel .watch-state.is-on { color: var(--accent); }
    .watch-panel .watch-form { display: inline; }
    .watch-panel .watch-hint {
      font-family: var(--mono); font-size: 0.7rem; color: var(--ink-3);
      margin-left: auto;
    }

    /* Misc */
    .footer-rule {
      border-top: 1px solid var(--ink-rule);
      margin: 3rem 0 0;
      padding-top: 0.6rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      display: flex; gap: 1rem;
    }
    .err-text { color: var(--err); font-family: var(--mono); font-size: 0.85rem; }
    .skel { color: var(--ink-3); font-style: italic; font-family: var(--serif); }
    .preview-toolbar {
      display: flex; gap: 0.5rem;
      margin: 0.5rem 0 1rem;
      padding: 0.4rem 0;
      border-top: 1px dotted var(--ink-rule);
      border-bottom: 1px dotted var(--ink-rule);
    }
    .preview-toolbar .control-action {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.2rem 0.6rem;
      text-decoration: none;
    }
    .preview-toolbar .control-action:hover { color: var(--ink); border-color: var(--ink); }
    .preview-img img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .preview-pdf iframe { background: var(--paper-2); }
    .preview-text pre {
      max-height: 60vh;
      overflow: auto;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
      padding: 0.8rem;
    }

    /* ============================================================
     * v0.2 shell — top nav + 3-column body
     * ============================================================ */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--paper);
      border-bottom: 1px solid var(--ink-rule);
    }
    .topnav-inner {
      max-width: 100%;
      padding: 0.55rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .topnav-spacer { flex: 1; }
    .topnav-actions { display: flex; gap: 0.4rem; align-items: center; }
    .topnav-action, .topnav-form button {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      background: transparent;
      border: 1px solid var(--ink-rule);
      padding: 0.2rem 0.55rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      text-decoration: none;
      border-bottom: 1px solid var(--ink-rule);
    }
    .topnav-action:hover, .topnav-form button:hover {
      color: var(--ink);
      border-color: var(--ink);
    }
    .topnav-form { display: inline; margin: 0; padding: 0; }

    /* Space switcher dropdown */
    .space-switcher { position: relative; min-width: 0; max-width: 30rem; }
    .nav-space { position: relative; }
    .nav-space-summary {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--ink-rule);
      background: var(--paper);
      user-select: none;
      min-width: 0;
      max-width: 30rem;
    }
    .nav-space-summary::-webkit-details-marker { display: none; }
    .nav-space-summary::marker { content: ''; }
    .nav-space-mark { color: var(--accent); font-size: 0.95rem; line-height: 1; }
    .nav-space-name {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 0.95rem;
      max-width: 12rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-space-path {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      max-width: 14rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .nav-space-caret { color: var(--ink-3); font-size: 0.7rem; margin-left: 0.2rem; }
    .nav-space-panel {
      position: absolute;
      top: calc(100% + 0.3rem);
      left: 0;
      min-width: 24rem;
      max-width: 32rem;
      max-height: 30rem;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 0.6rem 0.8rem 0.8rem;
      z-index: 30;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .nav-space-head {
      display: flex; justify-content: space-between; align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.5rem;
    }
    .nav-space-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .nav-space-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
    }
    .nav-space-link {
      display: block;
      padding: 0.4rem 0.4rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--ink-2);
      border-bottom: 0;
    }
    .nav-space-link:hover { color: var(--ink); border-bottom: 0; background: var(--paper-2); }
    .nav-space-link.is-current { color: var(--ink); font-weight: 600; }

    /* Search trigger */
    .search-trigger { display: inline-flex; min-width: 18rem; flex: 1; max-width: 28rem; }
    .search-summary {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--ink-rule);
      background: var(--paper);
      flex: 1;
      max-width: 28rem;
      color: var(--ink-3);
      user-select: none;
    }
    .search-summary::-webkit-details-marker { display: none; }
    .search-summary::marker { content: ''; }
    .search-icon { color: var(--accent); font-size: 1rem; line-height: 1; }
    .search-label {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.01em;
      flex: 1;
      text-align: left;
    }
    .search-kbd {
      border: 1px solid var(--ink-rule);
      padding: 0.05rem 0.4rem;
      font-size: 0.7rem;
      color: var(--ink-2);
      letter-spacing: 0.05em;
    }

    /* 3-column body — PR6. Side tracks are fixed at --col-left-w /
     * --col-right-w. The centre track is `minmax(0, 1fr)` so it
     * shrinks when the viewport is narrow; page-level content
     * centres itself inside that track via .col-main > .page {
     * max-width: var(--col-main-max); margin: 0 auto; }.
     */
    .shell-body {
      flex: 1;
      display: grid;
      grid-template-columns: var(--col-left-w) minmax(0, 1fr) var(--col-right-w);
      min-height: 0;
    }
    .col-left, .col-right {
      border-right: 1px solid var(--ink-rule);
      background: var(--paper);
      overflow-y: auto;
      max-height: calc(100vh - 3rem);
      position: sticky;
      top: 3rem;
    }
    .col-right { border-right: 0; border-left: 1px solid var(--ink-rule); }
    .col-main { min-width: 0; }
    .col-main > .page { max-width: var(--col-main-max); margin: 0 auto; }
    .left-divider, .right-divider {
      border-top: 1px solid var(--ink-rule);
      margin: 0;
    }

    /* PR8 responsive tiers.
     *
     * Wide (default) : three columns, fixed 320px side rails.
     * ≤1100px (68.75rem) : hide the right rail (graph + props).
     *   The centre track + left rail remain. Two-column mode.
     * ≤900px (56.25rem) : tighten the left rail to 240px so the
     *   centre column doesn't get pinched below ~660px on iPad
     *   portrait. Files pill row still fits.
     * ≤720px (45rem) : single column. Hide both rails. Phone-only.
     */
    @media (max-width: 68.75rem) {
      .shell-body {
        grid-template-columns: var(--col-left-w) minmax(0, 1fr);
      }
      .col-right { display: none; }
    }
    @media (max-width: 56.25rem) {
      .shell-body {
        grid-template-columns: 15rem minmax(0, 1fr);
      }
      .files-pill-label { font-size: 0.62rem; }
      .files-pill-count { font-size: 0.6rem; }
    }
    @media (max-width: 45rem) {
      .shell-body {
        grid-template-columns: minmax(0, 1fr);
      }
      .col-left { display: none; }
    }

    /* Tree panel (left top) */
    .tree-panel {
      padding: 1rem 1rem 1rem;
      max-height: 40vh;
      overflow-y: auto;
    }
    .tree-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.6rem;
    }
    .tree-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .tree-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
    }
    .tree-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
      padding: 0.5rem 0.2rem;
    }
    .tree-node { padding: 0.05rem 0; }
    .tree-node > summary {
      list-style: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink);
      padding: 0.18rem 0.3rem;
      display: flex;
      align-items: baseline;
      gap: 0.3rem;
      user-select: none;
    }
    .tree-node > summary::-webkit-details-marker { display: none; }
    .tree-node > summary::marker { content: ''; }
    .tree-marker { color: var(--ink-3); font-size: 0.7rem; width: 0.7rem; }
    .tree-name { font-family: var(--mono); font-weight: 600; color: var(--ink); }
    .tree-count-pill {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      margin-left: auto;
    }
    .tree-children { list-style: none; padding: 0 0 0 1rem; margin: 0; }
    .tree-leaf { list-style: none; }
    .tree-leaf-link {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.15rem 0.3rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      border-bottom: 1px dotted var(--ink-rule);
      text-decoration: none;
      word-break: break-all;
    }
    .tree-leaf-link:hover { color: var(--ink); background: var(--paper-2); }
    .tree-leaf-name { color: var(--ink); }
    .tree-leaf-kind { color: var(--ink-3); font-size: 0.7rem; }

    /* Files panel (left bottom) */
    .files-panel { padding: 0.8rem 1rem 1rem; }
    .files-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.5rem;
    }
    .files-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .files-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-3);
    }
    .files-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
      padding: 0.5rem 0.2rem;
    }
    .files-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      padding: 0 1rem 0.6rem;
      border-bottom: 1px dotted var(--ink-rule);
      margin-bottom: 0.4rem;
    }
    .files-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 0.3rem;
      padding: 0.15rem 0.45rem;
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-2);
      border: 1px solid var(--ink-rule);
      border-radius: 2px;
      background: var(--paper-2);
    }
    .files-pill:hover { color: var(--ink); border-color: var(--ink); }
    .files-pill-count { color: var(--ink-3); }
    .files-pill-all { color: var(--ink); }
    .files-pill-md, .files-pill-org { border-color: var(--ink-2); }
    .files-pill-pdf, .files-pill-docx, .files-pill-pptx, .files-pill-xlsx { color: var(--accent); border-color: var(--accent-soft); }
    .files-pill-csv, .files-pill-tsv { color: var(--warn); border-color: var(--warn); }
    .files-list {
      list-style: none;
      padding: 0;
      margin: 0;
      /* PR8: long paths scroll horizontally inside the 320px
       * rail rather than overflowing the panel. */
      overflow-x: auto;
    }
    .files-row { padding: 0.05rem 0; }
    .files-link {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.25rem 0.3rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-2);
      border-bottom: 1px dotted var(--ink-rule);
      text-decoration: none;
      word-break: break-all;
    }
    .files-link:hover { color: var(--ink); background: var(--paper-2); }
    .files-ext {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--paper);
      background: var(--ink-2);
      padding: 0.05rem 0.3rem;
      letter-spacing: 0.05em;
      min-width: 3.5rem;
      text-align: center;
      flex: 0 0 auto;
    }
    .files-ext-attachment { background: var(--warn); }
    .files-name { flex: 1; }
    .files-size { color: var(--ink-3); font-size: 0.7rem; }
    .files-download, .files-jump { font-size: 0.7rem; color: var(--accent); }
    .files-download:hover, .files-jump:hover { color: var(--ink); }

    /* Properties panel (right top) */
    .props-panel { padding: 1rem; }
    .props-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.6rem;
    }
    .props-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .props-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
    }
    .props-detail { font-family: var(--mono); font-size: 0.82rem; }
    .props-title {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      word-break: break-word;
    }
    .props-ref {
      color: var(--ink-3);
      font-size: 0.74rem;
      margin-bottom: 0.6rem;
      word-break: break-all;
    }
    .props-meta { margin-bottom: 0.7rem; }
    .props-meta-row {
      display: grid;
      grid-template-columns: 5rem 1fr;
      gap: 0.4rem;
      padding: 0.15rem 0;
      border-bottom: 1px dotted var(--ink-rule);
    }
    .props-meta-k {
      color: var(--ink-3);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .props-meta-v { word-break: break-all; font-size: 0.78rem; }
    .props-section-title {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin: 0.5rem 0 0.4rem;
    }
    .props-list { margin: 0; padding: 0; }
    .props-list .props-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 0.4rem;
      padding: 0.18rem 0;
      border-bottom: 1px dotted var(--ink-rule);
      font-size: 0.78rem;
      word-break: break-word;
    }
    .props-list .props-row dt {
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.7rem;
    }
    .props-list .props-row dd { margin: 0; }
    .props-rollup-title {
      font-family: var(--serif);
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }

    /* Graph panel (right bottom) */
    .graph-panel { padding: 0.8rem 1rem 1rem; }
    .graph-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--ink-rule);
      margin-bottom: 0.5rem;
    }
    .graph-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .graph-count { color: var(--ink-3); }
    .graph-empty {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-3);
      font-size: 0.85rem;
      padding: 0.5rem 0;
    }
    .np-svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper-2);
      border: 1px solid var(--ink-rule);
    }
    .np-link {
      stroke: var(--ink-rule);
      stroke-width: 0.8;
      fill: none;
    }
    .np-link.is-active { stroke: var(--accent); stroke-width: 1.4; }
    .np-node {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 1;
    }
    .np-node.is-focus { fill: var(--accent); stroke: var(--accent); }
    .np-node.is-neighbor { fill: var(--paper); stroke: var(--ink); }
    .np-label {
      font-family: var(--mono);
      font-size: 8px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
    }
    .np-label.is-focus { fill: var(--paper); font-weight: 600; }

    /* Command palette overlay */
    .palette-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      z-index: 100;
      justify-content: flex-start;
      align-items: flex-start;
      padding-top: 4rem;
    }
    .palette-overlay:target,
    .palette-overlay.is-open { display: flex; }
    .palette-modal {
      width: min(40rem, 90vw);
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--ink);
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
      max-height: 70vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .palette-prompt {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--ink-rule);
    }
    .palette-mark { color: var(--accent); font-size: 1.1rem; line-height: 1; }
    .palette-input {
      flex: 1;
      border: 0;
      background: transparent;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--ink);
      padding: 0.3rem 0;
    }
    .palette-input:focus { outline: none; }
    .palette-close {
      color: var(--ink-3);
      font-size: 0.7rem;
      border: 1px solid var(--ink-rule);
      padding: 0.05rem 0.4rem;
    }
    .palette-results { overflow-y: auto; padding: 0.4rem 0; }
    .palette-empty {
      font-family: var(--serif);
