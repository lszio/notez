<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notez</title>
  <script>
    (function () {
      // Restore the persisted theme BEFORE first paint so a dark-mode
      // user never sees a light flash.
      try {
        var stored = localStorage.getItem('notez-theme') || 'system';
        document.documentElement.dataset.theme = stored;
      } catch (e) {
        document.documentElement.dataset.theme = 'system';
      }
    })();
  </script>
  <script>
    (function () {
      // Theme control: Light / Dark / System cycle. The button's
      // aria-label always names the CURRENT mode, and the change is
      // instant with no reload.
      function current() {
        return document.documentElement.dataset.theme || 'system';
      }
      function syncToggle() {
        var t = current();
        document.querySelectorAll('[data-theme-toggle]').forEach(function (toggle) {
          toggle.setAttribute('aria-label', 'Theme: ' + t);
          toggle.title = 'Theme: ' + t + ' — click to change';
        });
      }
      document.addEventListener('click', function (event) {
        var toggle = event.target.closest && event.target.closest('[data-theme-toggle]');
        if (!toggle) return;
        var c = current();
        var next = c === 'light' ? 'dark' : c === 'dark' ? 'system' : 'light';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('notez-theme', next); } catch (e) {}
        syncToggle();
      });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncToggle);
      } else {
        syncToggle();
      }
    })();
  </script>
  <style>
    /* =====================================================================
     * Notez — "Quiet note workspace" v2.
     *
     * A note-first visual language in the spirit of Obsidian/Logseq:
     * one persistent sidebar for navigation, a generous reading column,
     * calm surfaces, a single violet accent. Every interactive element
     * pairs a visual cue with a text label (never colour alone).
     *
     * Layout map (see src/layout.rs and pages/):
     *   .shell                 grid: sidebar | main-col
     *   .sidebar               brand, switcher, search, nav, tree, files
     *   .main-col > .topbar    drawer toggles, space name, +note menu
     *   .main-col > .content   routed page (.page …)
     *   .note-grid             note page: article + .rail (inspector)
     * ===================================================================== */

    /* ----- tokens ------------------------------------------------------ */
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas,
                   "Liberation Mono", monospace;

      --radius: 8px;
      --radius-sm: 5px;
      --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.35);
      --shadow-drawer: 0 0 48px rgba(0, 0, 0, 0.45);

      --topbar-h: 3rem;
      --sidebar-w: 18.5rem;

      --content-measure: 46rem;

      /* Legacy token aliases — the `ui` crate components (NzBadge /
       * NzCard / NzInput) still reference the v1 token names. The
       * var() indirection resolves against the active theme. */
      --ink: var(--fg);
      --ink-2: var(--fg-2);
      --ink-rule: var(--line);
      --info: var(--accent);
      --paper-2: var(--bg-2);
      --r-sm: var(--radius-sm);
      --r-md: var(--radius);
      --shadow-1: none;
      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-4: 1rem;
    }

    /* dark (default) */
    html[data-theme="dark"], html[data-theme="system"] {
      --bg: #161619;
      --bg-1: #1c1c20;      /* sidebar */
      --bg-2: #232327;      /* cards, panes */
      --bg-3: #2b2b31;      /* raised: inputs, hover */
      --line: #2e2e34;
      --line-soft: #26262c;
      --fg: #dededf;
      --fg-2: #a6a6ad;
      --fg-3: #73737b;
      --accent: #9d7bff;
      --accent-strong: #b39bff;
      --accent-soft: rgba(157, 123, 255, 0.16);
      --accent-fg: #16131f;
      --ok: #4cc38a;
      --warn: #e0b25b;
      --err: #e2695c;
      --code-bg: #232329;
      --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --bg-1: #f9f9fb;
      --bg-2: #f2f2f5;
      --bg-3: #e9e9ee;
      --line: #e4e4e9;
      --line-soft: #ececf0;
      --fg: #202024;
      --fg-2: #5a5a64;
      --fg-3: #8f8f99;
      --accent: #6d4fd6;
      --accent-strong: #5b3fc4;
      --accent-soft: rgba(109, 79, 214, 0.12);
      --accent-fg: #ffffff;
      --ok: #1f9d63;
      --warn: #a97414;
      --err: #c74a3d;
      --code-bg: #f0f0f3;
      --shadow-pop: 0 12px 32px rgba(30, 30, 40, 0.18);
    }
    @media (prefers-color-scheme: light) {
      html[data-theme="system"] {
        --bg: #ffffff;
        --bg-1: #f9f9fb;
        --bg-2: #f2f2f5;
        --bg-3: #e9e9ee;
        --line: #e4e4e9;
        --line-soft: #ececf0;
        --fg: #202024;
        --fg-2: #5a5a64;
        --fg-3: #8f8f99;
        --accent: #6d4fd6;
        --accent-strong: #5b3fc4;
        --accent-soft: rgba(109, 79, 214, 0.12);
        --accent-fg: #ffffff;
        --ok: #1f9d63;
        --warn: #a97414;
        --err: #c74a3d;
        --code-bg: #f0f0f3;
        --shadow-pop: 0 12px 32px rgba(30, 30, 40, 0.18);
      }
    }

    /* ----- base --------------------------------------------------------- */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 2px; }
    h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 0.5rem; font-weight: 650; }
    p { margin: 0 0 0.7rem; }
    ul { margin: 0; padding: 0; list-style: none; }
    dl, dt, dd { margin: 0; }
    code, pre, .mono-sm { font-family: var(--font-mono); }
    .mono-sm { font-size: 0.78rem; }
    .dim { color: var(--fg-3); }
    .muted { color: var(--fg-2); }
    .err-text { color: var(--err); }
    .skel { color: var(--fg-3); font-style: italic; padding: 1rem; }
    .empty-hint { color: var(--fg-3); font-size: 0.85rem; margin: 0.2rem 0; }
    ::selection { background: var(--accent-soft); }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-radius: 3px;
    }

    /* ----- shell grid ---------------------------------------------------- */
    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      height: 100vh;
    }

    /* ----- sidebar ------------------------------------------------------- */
    .sidebar {
      background: var(--bg-1);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .sb-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem 0.6rem;
    }
    .sb-wordmark {
      font-weight: 750;
      font-size: 1.02rem;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
    .sb-wordmark:hover { color: var(--accent); text-decoration: none; }
    .theme-toggle {
      background: none;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--fg-2);
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      padding: 0.28rem 0.5rem;
    }
    .theme-toggle:hover { color: var(--fg); border-color: var(--fg-3); }

    .sb-switch { padding: 0 0.6rem; }
    .nav-source { position: relative; }
    .nav-source-summary {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      list-style: none;
      cursor: pointer;
      padding: 0.45rem 0.55rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      color: var(--fg);
      font-weight: 600;
    }
    .nav-source-summary::-webkit-details-marker { display: none; }
    .nav-source-summary:hover { background: var(--bg-2); }
    .nav-source-mark { color: var(--accent); }
    .nav-source-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-source-caret { color: var(--fg-3); font-size: 0.7rem; }
    .nav-source-panel {
      position: absolute;
      z-index: 60;
      left: 0; right: 0;
      margin-top: 0.3rem;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-pop);
      padding: 0.55rem;
      max-height: 70vh;
      overflow: auto;
    }
    .nav-source-head {
      display: flex;
      justify-content: space-between;
      color: var(--fg-3);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.1rem 0.3rem 0.35rem;
    }
    .nav-source-link {
      display: block;
      padding: 0.32rem 0.45rem;
      border-radius: var(--radius-sm);
      color: var(--fg-2);
    }
    .nav-source-link:hover { background: var(--bg-3); color: var(--fg); text-decoration: none; }
    .nav-source-link.is-current { color: var(--fg); background: var(--accent-soft); }

    .side-list { margin-top: 0.25rem; }
    .side-item { margin: 1px 0; }
    .side-link {
      display: block;
      padding: 0.35rem 0.45rem;
      border-radius: var(--radius-sm);
      color: var(--fg-2);
    }
    .side-link:hover { background: var(--bg-3); color: var(--fg); text-decoration: none; }
    .side-link.is-current { background: var(--accent-soft); color: var(--fg); }
    .side-link-name { display: block; font-weight: 600; }
    .side-link-path {
      display: block;
      color: var(--fg-3);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side-tag {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0 0.35rem;
      font-size: 0.66rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .side-tag.is-error { color: var(--err); border-color: var(--err); }
    .side-empty { color: var(--fg-3); padding: 0.3rem 0.45rem; }
    .side-remotes { margin-top: 0.6rem; }
    .side-head {
      display: flex;
      justify-content: space-between;
      color: var(--fg-3);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.3rem;
    }
    .side-add { margin-top: 0.6rem; border-top: 1px solid var(--line-soft); padding-top: 0.5rem; }
    .side-add summary {
      cursor: pointer;
      color: var(--fg-2);
      font-size: 0.82rem;
      padding: 0.25rem 0.45rem;
      border-radius: var(--radius-sm);
    }
    .side-add summary:hover { background: var(--bg-2); color: var(--fg); }
    .side-add-form { display: grid; gap: 0.45rem; padding: 0.5rem 0.3rem 0.2rem; }
    .side-add-form label {
      color: var(--fg-3);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .side-add-form input {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--fg);
      padding: 0.4rem 0.5rem;
      font-size: 0.85rem;
    }
    .side-add-form input:focus { border-color: var(--accent); outline: none; }

    .sb-search { padding: 0.45rem 0.6rem 0.2rem; }
    .search-trigger {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--fg-3);
      cursor: pointer;
      font: inherit;
      padding: 0.42rem 0.6rem;
    }
    .search-trigger:hover { border-color: var(--fg-3); color: var(--fg-2); }
    .search-icon { color: var(--fg-3); }
    .search-label { flex: 1; text-align: left; font-size: 0.85rem; }
    .search-kbd {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 0.3rem;
      font-size: 0.7rem;
      color: var(--fg-3);
    }

    .sb-nav { padding: 0.5rem 0.6rem 0.2rem; display: grid; gap: 1px; }
    .sb-link {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.4rem 0.55rem;
      border-radius: var(--radius-sm);
      color: var(--fg-2);
      font-weight: 550;
    }
    .sb-link:hover { background: var(--bg-2); color: var(--fg); text-decoration: none; }
    .sb-link.is-current {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .sb-link-icon { width: 1.1rem; text-align: center; color: var(--fg-3); }
    .sb-link.is-current .sb-link-icon { color: var(--accent); }

    .sb-tree { flex: 1; min-height: 0; padding: 0.4rem 0.6rem 1rem; }
    .sb-hint { color: var(--fg-3); padding: 0.6rem 0.3rem; font-size: 0.85rem; }

    /* tree panel */
    .tree-panel { margin-bottom: 0.8rem; }
    .tree-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.15rem 0.3rem 0.3rem;
    }
    .tree-label, .files-label, .props-label {
      color: var(--fg-3);
      font-size: 0.7rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }
    .tree-subtitle { color: var(--fg-3); font-size: 0.72rem; margin-left: 0.4rem; }
    .tree-count { color: var(--fg-3); font-size: 0.75rem; }
    .tree-node { margin: 1px 0; }
    .tree-summary {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      list-style: none;
      padding: 0.22rem 0.3rem;
      border-radius: var(--radius-sm);
      color: var(--fg-2);
      font-size: 0.85rem;
    }
    .tree-summary::-webkit-details-marker { display: none; }
    .tree-summary:hover { background: var(--bg-2); color: var(--fg); }
    .tree-marker { color: var(--fg-3); font-size: 0.62rem; width: 0.8rem; }
    .tree-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-count-pill { color: var(--fg-3); font-size: 0.7rem; }
    .tree-children { padding-left: 0.65rem; border-left: 1px solid var(--line-soft); margin-left: 0.45rem; }
    .tree-leaf { margin: 1px 0; }
    .tree-leaf-link {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.22rem 0.3rem;
      border-radius: var(--radius-sm);
      color: var(--fg-2);
      font-size: 0.85rem;
    }
    .tree-leaf-link:hover { background: var(--bg-2); color: var(--fg); text-decoration: none; }
    .tree-leaf-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-leaf-kind { color: var(--fg-3); font-size: 0.7rem; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-empty, .files-empty { color: var(--fg-3); padding: 0.2rem 0.3rem; font-size: 0.8rem; }

    /* files (recent) panel in sidebar */
    .files-panel { margin-top: 0.4rem; }
    .files-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.15rem 0.3rem 0.3rem;
    }
    .files-count { color: var(--fg-3); font-size: 0.75rem; }
    .files-list { display: grid; gap: 1px; }
    .files-row { display: flex; align-items: center; gap: 0.4rem; }
    .files-link {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.3rem;
      border-radius: var(--radius-sm);
      color: var(--fg-2);
      font-size: 0.83rem;
    }
    .files-link:hover { background: var(--bg-2); color: var(--fg); text-decoration: none; }
    .files-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .files-ext {
      flex-shrink: 0;
      color: var(--fg-3);
      font-size: 0.62rem;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 0.25rem;
      letter-spacing: 0.04em;
    }
    .files-mtime { flex-shrink: 0; color: var(--fg-3); font-size: 0.68rem; }
    .files-size { flex-shrink: 0; color: var(--fg-3); font-size: 0.68rem; }
    .files-pills { display: flex; flex-wrap: wrap; gap: 4px; padding: 0.15rem 0 0.35rem; }
    .files-pill {
      font-size: 0.68rem;
      padding: 0.05rem 0.4rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg-2);
    }
    .files-pill:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .files-pill-count { color: var(--fg-3); }

    /* ----- main column --------------------------------------------------- */
    .main-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      height: var(--topbar-h);
      padding: 0 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .topbar-space {
      font-weight: 650;
      color: var(--fg-2);
      font-size: 0.86rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-spacer { flex: 1; }

    .drawer-toggle {
      background: none;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--fg-2);
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      padding: 0.35rem 0.5rem;
      display: none;
    }
    .drawer-toggle:hover { background: var(--bg-2); color: var(--fg); border-color: var(--line); }

    .new-note { position: relative; }
    .new-note-btn { list-style: none; cursor: pointer; }
    .new-note[open] .new-note-btn { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .new-note-form {
      position: absolute;
      right: 0;
      top: calc(100% + 0.4rem);
      z-index: 70;
      width: 16rem;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-pop);
      padding: 0.8rem;
      display: grid;
      gap: 0.6rem;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 80;
    }

    /* ----- generic page bits --------------------------------------------- */
    .page { max-width: 78rem; margin: 0 auto; padding: 1.4rem 1.6rem 3rem; }
    .page-head { margin-bottom: 1.1rem; }
    .page-eyebrow {
      color: var(--fg-3);
      font-size: 0.72rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 0 0 0.25rem;
    }
    .page-title { font-size: 1.45rem; margin: 0 0 0.3rem; }
    .page-lede { color: var(--fg-2); margin: 0; }
    .section-title { font-size: 1.02rem; margin: 1.4rem 0 0.6rem; }

    .btn {
      display: inline-block;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--fg);
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
      padding: 0.4rem 0.85rem;
    }
    .btn:hover { border-color: var(--fg-3); text-decoration: none; }
    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
    }
    .btn-accent:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-fg); text-decoration: none; }

    .mini-btn {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--fg-2);
      cursor: pointer;
      font: inherit;
      font-size: 0.75rem;
      padding: 0.12rem 0.45rem;
    }
    .mini-btn:hover:not(:disabled) { color: var(--fg); border-color: var(--fg-3); }
    .mini-btn:disabled { opacity: 0.4; cursor: default; }
    .mini-btn-warn:hover:not(:disabled) { color: var(--err); border-color: var(--err); }

    .field { display: grid; gap: 0.25rem; }
    .field-label { color: var(--fg-3); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
    input[type="text"], input[type="date"], textarea {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--fg);
      font: inherit;
      padding: 0.42rem 0.55rem;
    }
    input:focus, textarea:focus { border-color: var(--accent); outline: none; }
    .radio { display: flex; align-items: center; gap: 0.45rem; color: var(--fg-2); cursor: pointer; }
    .radio input { accent-color: var(--accent); }

    /* kind chips */
    .kind {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.04em;
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      border: 1px solid var(--line);
      color: var(--fg-2);
      text-transform: uppercase;
    }
    .kind-document { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .kind-heading { color: var(--ok); border-color: var(--ok); }
    .kind-attachment { color: var(--warn); border-color: var(--warn); }
    .kind-block { color: var(--fg-3); }

    /* ----- home widgets --------------------------------------------------- */
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(21rem, 1fr));
      gap: 1rem;
      align-items: start;
    }
    .widget {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .widget-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.7rem 0.95rem 0.35rem;
      border-bottom: 1px solid var(--line-soft);
    }
    .widget-title { font-size: 0.95rem; margin: 0; }
    .widget-more { font-size: 0.78rem; color: var(--fg-3); }
    .widget-more:hover { color: var(--accent); }
    .widget-body { padding: 0.7rem 0.95rem 0.9rem; }
    .widget-body-graph { padding: 0.4rem; }

    .recent-list { display: grid; gap: 2px; }
    .recent-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.8rem;
    }
    .recent-link {
      flex: 1;
      min-width: 0;
      color: var(--fg-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0.16rem 0;
    }
    .recent-link:hover { color: var(--accent); }
    .recent-when { flex-shrink: 0; font-size: 0.72rem; }

    .activity-list { display: grid; gap: 0.15rem; }
    .activity-inner {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.83rem;
      padding: 0.14rem 0;
    }
    .activity-action { color: var(--fg); font-weight: 600; white-space: nowrap; }
    .activity-target {
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 9rem;
    }
    .activity-space { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity-when { margin-left: auto; flex-shrink: 0; font-size: 0.72rem; }
    .activity-link { flex-shrink: 0; font-size: 0.75rem; }

    .space-list { display: grid; gap: 2px; }
    .space-link {
      display: block;
      padding: 0.35rem 0.4rem;
      border-radius: var(--radius-sm);
      color: inherit;
    }
    .space-link:hover { background: var(--bg-2); text-decoration: none; }
    .space-name { display: block; font-weight: 650; color: var(--fg); }
    .space-path { display: block; font-size: 0.72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .customize { margin: 0 0 1rem; border: 1px dashed var(--line); border-radius: var(--radius); }
    .customize > summary {
      cursor: pointer;
      color: var(--fg-3);
      font-size: 0.8rem;
      padding: 0.45rem 0.8rem;
    }
    .customize > summary:hover { color: var(--fg-2); }
    .customize-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
      gap: 1rem;
      padding: 0.4rem 0.9rem 0.9rem;
      border-top: 1px solid var(--line-soft);
    }
    .customize-title {
      color: var(--fg-3);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0.4rem 0 0.3rem;
    }
    .customize-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.18rem 0;
      font-size: 0.85rem;
    }
    .customize-actions { display: flex; gap: 4px; }

    /* ----- journal --------------------------------------------------------- */
    .journal-today {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      margin-bottom: 1.2rem;
    }
    .journal-today-head {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }
    .journal-kicker {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .journal-date { color: var(--fg-2); }
    .journal-today-body { display: grid; gap: 0.55rem; justify-items: start; }
    .journal-today-title { color: var(--fg); font-size: 1rem; margin: 0; }
    .journal-today-hint { color: var(--fg-3); margin: 0; }
    .journal-list { display: grid; gap: 1px; }
    .journal-row {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      padding: 0.2rem 0.1rem;
      border-bottom: 1px solid var(--line-soft);
    }
    .journal-row:last-child { border-bottom: none; }
    .journal-row-date { flex-shrink: 0; color: var(--fg-3); }
    .journal-row-link {
      flex: 1;
      min-width: 0;
      color: var(--fg-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .journal-row-link:hover { color: var(--accent); }
    .journal-custom { margin-top: 1.2rem; border: 1px dashed var(--line); border-radius: var(--radius); }
    .journal-custom > summary { cursor: pointer; color: var(--fg-3); padding: 0.5rem 0.85rem; font-size: 0.85rem; }
    .journal-custom-form { display: flex; align-items: end; gap: 0.7rem; padding: 0.4rem 0.9rem 0.9rem; }
    .journal-list-compact { margin-top: 0.7rem; }
    .journal-list-compact .journal-row { border-bottom: none; padding: 0.08rem 0; }

    .landing-form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; padding: 0.6rem 0.9rem 0.9rem; }

    /* ----- note page -------------------------------------------------------- */
    .note-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 17rem;
      gap: 1.6rem;
      align-items: start;
    }
    .note-main { min-width: 0; max-width: var(--content-measure); }

    .note-head { margin-bottom: 1rem; }
    .note-head-top { display: flex; align-items: baseline; gap: 0.7rem; }
    .note-title { font-size: 1.55rem; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .star-form { flex-shrink: 0; }
    .star-btn {
      background: none;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--fg-3);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0.25rem 0.5rem;
    }
    .star-btn:hover { color: var(--warn); border-color: var(--warn); }
    .star-btn.is-starred { color: var(--warn); border-color: var(--warn); background: rgba(224, 178, 91, 0.12); }
    .note-refline {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      color: var(--fg-3);
      margin: 0.35rem 0 0.45rem;
    }
    .note-ref { color: var(--fg-3); overflow-wrap: anywhere; }
    .note-status { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }

    .note-grid .rail {
      position: sticky;
      top: calc(var(--topbar-h) + 1rem);
      display: grid;
      gap: 0.9rem;
      max-height: calc(100vh - var(--topbar-h) - 2rem);
      overflow-y: auto;
      scrollbar-width: thin;
      padding-right: 2px;
    }
    .rail-card {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.7rem 0.8rem 0.8rem;
    }
    .rail-card-title {
      color: var(--fg-3);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin: 0 0 0.45rem;
    }
    .rail-card-title-sub { margin-top: 0.9rem; }
    .rail-card-body { font-size: 0.83rem; }
    .rail-empty { color: var(--fg-3); margin: 0; font-size: 0.8rem; }

    .outline-list { display: grid; gap: 1px; }
    .outline-item { margin: 0; }
    .outline-l2 { padding-left: 0.6rem; }
    .outline-l3 { padding-left: 1.2rem; }
    .outline-l4 { padding-left: 1.8rem; }
    .outline-l5 { padding-left: 2.4rem; }
    .outline-l6 { padding-left: 3rem; }
    .outline-link {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--fg-2);
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
      padding: 0.12rem 0.25rem;
      border-radius: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .outline-link:hover { background: var(--bg-2); color: var(--accent); }

    .link-list { display: grid; gap: 1px; }
    .link-row-link {
      display: block;
      color: var(--fg-2);
      font-size: 0.8rem;
      padding: 0.14rem 0.25rem;
      border-radius: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-row-link:hover { background: var(--bg-2); color: var(--accent); text-decoration: none; }
    .link-missing {
      display: block;
      color: var(--fg-3);
      font-size: 0.8rem;
      padding: 0.14rem 0.25rem;
      text-decoration: line-through;
    }

    .rail-graph .graph-svg-mini { height: 11rem; }

    /* banners */
    .doc-banner {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 0.6rem 0.85rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .doc-banner-err { border-color: var(--err); background: rgba(226, 105, 92, 0.08); }
    .doc-banner-ok { border-color: var(--ok); background: rgba(76, 195, 138, 0.08); }
    .doc-banner-head { display: flex; gap: 0.6rem; align-items: baseline; }
    .doc-banner-kind { font-weight: 700; }
    .doc-banner-err .doc-banner-kind { color: var(--err); }
    .doc-banner-ok .doc-banner-kind { color: var(--ok); }
    .doc-banner-msg { color: var(--fg-2); }
    .doc-banner-actions { display: flex; gap: 0.7rem; align-items: baseline; margin-top: 0.3rem; }
    .doc-banner-note { color: var(--fg-3); font-size: 0.78rem; }

    /* read / edit / source mode tabs (pure CSS radios) */
    .doc-mode-input { position: absolute; opacity: 0; pointer-events: none; }
    .doc-mode-tabs {
      display: inline-flex;
      gap: 2px;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 2px;
      margin-bottom: 0.9rem;
    }
    .doc-mode-tab {
      cursor: pointer;
      padding: 0.22rem 0.75rem;
      border-radius: 4px;
      color: var(--fg-2);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .doc-mode-tab:hover { color: var(--fg); }
    .doc-pane { display: none; }
    #doc-mode-read:checked ~ .doc-mode-tabs label[for="doc-mode-read"],
    #doc-mode-edit:checked ~ .doc-mode-tabs label[for="doc-mode-edit"],
    #doc-mode-source:checked ~ .doc-mode-tabs label[for="doc-mode-source"] {
      background: var(--bg-3);
      color: var(--fg);
    }
    #doc-mode-read:checked ~ .doc-mode-panes .doc-pane-read { display: block; }
    #doc-mode-edit:checked ~ .doc-mode-panes .doc-pane-editor { display: block; }
    #doc-mode-edit:checked ~ .doc-mode-panes .em-source { display: none; }
    #doc-mode-source:checked ~ .doc-mode-panes .doc-pane-editor { display: block; }
    #doc-mode-source:checked ~ .doc-mode-panes .em-edit { display: none; }

    /* the rendered note body — the reading surface */
    .note-body {
      font-size: 0.95rem;
      line-height: 1.72;
      color: var(--fg);
    }
    .note-body h1 { font-size: 1.4rem; margin: 1.6rem 0 0.6rem; scroll-margin-top: calc(var(--topbar-h) + 0.8rem); }
    .note-body h2 { font-size: 1.18rem; margin: 1.4rem 0 0.5rem; scroll-margin-top: calc(var(--topbar-h) + 0.8rem); }
    .note-body h3 { font-size: 1.02rem; margin: 1.2rem 0 0.4rem; scroll-margin-top: calc(var(--topbar-h) + 0.8rem); }
    .note-body h4, .note-body h5, .note-body h6 {
      font-size: 0.92rem;
      margin: 1rem 0 0.35rem;
      scroll-margin-top: calc(var(--topbar-h) + 0.8rem);
    }
    .note-body h1:first-child, .note-body h2:first-child, .note-body p:first-child { margin-top: 0; }
    .note-body p { margin: 0 0 0.85rem; }
    .note-body a { text-decoration: underline; text-decoration-color: var(--accent-soft); text-underline-offset: 2px; }
    .note-body a:hover { text-decoration-color: var(--accent); }
    .note-body ul, .note-body ol { margin: 0 0 0.85rem; padding-left: 1.4rem; }
    .note-body ul { list-style: disc; }
    .note-body ol { list-style: decimal; }
    .note-body li { margin: 0.15rem 0; }
    .note-body code {
      background: var(--code-bg);
      border-radius: 4px;
      font-size: 0.84em;
      padding: 0.1em 0.35em;
    }
    .note-body pre {
      background: var(--code-bg);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      overflow-x: auto;
      padding: 0.8rem 0.9rem;
      font-size: 0.82rem;
      line-height: 1.55;
      margin: 0 0 0.9rem;
    }
    .note-body pre code { background: none; padding: 0; }
    .note-body blockquote {
      border-left: 3px solid var(--accent);
      color: var(--fg-2);
      margin: 0 0 0.9rem;
      padding: 0.1rem 0 0.1rem 0.9rem;
    }
    .note-body table {
      border-collapse: collapse;
      margin: 0 0 0.9rem;
      width: 100%;
      font-size: 0.86rem;
    }
    .note-body th, .note-body td {
      border: 1px solid var(--line);
      padding: 0.35rem 0.55rem;
      text-align: left;
    }
    .note-body th { background: var(--bg-2); }
    .note-body img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }
    .note-body hr { border: none; border-top: 1px solid var(--line); margin: 1.4rem 0; }
    .note-body .mermaid, .note-body svg[aria-label] { max-width: 100%; }

    .editor-chrome {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      color: var(--fg-3);
      font-size: 0.78rem;
      margin-bottom: 0.4rem;
    }
    .editor-mode-label { font-weight: 650; color: var(--fg-2); }
    .editor-source-locator { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-edit-form { display: grid; gap: 0.5rem; }
    .editor-save-row {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      color: var(--fg-3);
      font-size: 0.78rem;
    }
    .doc-save-state { color: var(--fg-3); font-weight: 600; }
    .doc-save-state.is-dirty { color: var(--warn); }
    .editor-draft-note { color: var(--warn); }
    .edit-source-textarea {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.6;
      min-height: 24rem;
      resize: vertical;
      width: 100%;
      background: var(--bg-1);
    }
    .edit-source-actions { display: flex; gap: 0.7rem; align-items: center; }
    .edit-source-cancel, .edit-source-save { font-size: 0.85rem; }
    .edit-source-save {
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--accent-fg);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
    }

    .readonly-note {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--fg-2);
      padding: 0.85rem 1rem;
    }

    .janet-panel, .meta-drawer {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      margin-top: 1.6rem;
    }
    .janet-panel > summary, .meta-drawer > summary {
      cursor: pointer;
      color: var(--fg-3);
      font-size: 0.8rem;
      padding: 0.45rem 0.85rem;
    }
    .janet-panel-body, .meta-drawer-body { padding: 0.2rem 0.9rem 0.85rem; }
    .janet-panel-hint { color: var(--fg-3); font-size: 0.8rem; }
    .janet-input {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 0.84rem;
    }
    .janet-actions { margin-top: 0.4rem; }
    .meta-list { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 0.9rem; font-size: 0.82rem; }
    .meta-list dt { color: var(--fg-3); }

    .props-detail { font-size: 0.8rem; }
    .props-ref { color: var(--fg-3); margin-bottom: 0.45rem; overflow-wrap: anywhere; }
    .props-meta { display: grid; gap: 3px; }
    .props-meta-row { display: flex; gap: 0.5rem; }
    .props-meta-k { color: var(--fg-3); min-width: 4.2rem; }
    .props-meta-v { min-width: 0; overflow-wrap: anywhere; }
    .props-section-title {
      color: var(--fg-3);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0.7rem 0 0.25rem;
    }
    .props-list { display: grid; gap: 3px; }
    .props-row { display: flex; gap: 0.5rem; }
    .props-row dt { color: var(--fg-2); min-width: 5.5rem; overflow-wrap: anywhere; }
    .props-row dd { color: var(--fg); min-width: 0; overflow-wrap: anywhere; }

    /* ----- graph page -------------------------------------------------------- */
    .graph-layout {
      display: grid;
      grid-template-columns: 15rem minmax(0, 1fr);
      gap: 1.2rem;
      align-items: start;
    }
    .graph-side {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.8rem 0.9rem;
      font-size: 0.83rem;
      display: grid;
      gap: 0.9rem;
    }
    .graph-stats { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.8rem; }
    .graph-stats dt { color: var(--fg-3); }
    .graph-legend { display: grid; gap: 3px; color: var(--fg-2); }
    .swatch {
      display: inline-block;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-right: 0.45rem;
      background: var(--accent);
    }
    .swatch.is-hd { background: var(--ok); }
    .swatch.is-att { background: var(--warn); }
    .swatch.is-blk { background: var(--fg-3); }
    .graph-svg .graph-link { stroke: var(--line); stroke-width: 1; }
    .graph-svg .graph-link.is-active { stroke: var(--accent); }
    .graph-node { fill: var(--accent); }
    .graph-node.is-hd { fill: var(--ok); }
    .graph-node.is-att { fill: var(--warn); }
    .graph-node.is-blk { fill: var(--fg-3); }
    .graph-label {
      fill: var(--fg-3);
      font-size: 9px;
      text-anchor: middle;
      font-family: var(--font-ui);
      pointer-events: none;
    }
    .graph-svg a:hover .graph-node { stroke: var(--fg); stroke-width: 1.5; }
    .graph-empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--fg-3);
      padding: 2rem 1.4rem;
    }

    /* ----- files list page ------------------------------------------------ */
    .controls-wrapper { margin-bottom: 1rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.6rem 0.75rem;
    }
    .control { display: flex; align-items: center; gap: 0.45rem; }
    .control-label { color: var(--fg-3); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .control-spacer { flex: 1; }
    .control-form { display: flex; gap: 0.6rem; align-items: center; flex: 1; }
    input[name="q"] { min-width: 12rem; }

    .results-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
    }
    .mode-tabs { display: inline-flex; gap: 2px; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 2px; }
    .mode-tab {
      cursor: pointer;
      padding: 0.18rem 0.65rem;
      border-radius: 4px;
      color: var(--fg-2);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .mode-tab:hover { color: var(--fg); text-decoration: none; }
    .mode-tab.is-current { background: var(--bg-3); color: var(--fg); }
    .results-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--fg-3);
      font-size: 0.78rem;
      margin: 0.4rem 0;
    }
    .result {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      padding: 0.42rem 0.5rem;
      border-bottom: 1px solid var(--line-soft);
    }
    .result:hover { background: var(--bg-1); }
    .col-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-title a { color: var(--fg); font-weight: 600; }

        position: fixed;

    }

    /* ----- print: reading only ---------------------------------------------- */

      body { background: #fff; color: #000; }
    }
  </style>
    <!-- M6: hydrated Dioxus client. Served from /wasm/* by the
         server when built with `dx build --platform web`; harmless
         404 in SSR-only builds. -->
    <script type="module" src="/wasm/web.js"></script>
</head>
<body>
  <div id="main"></div>
<script>
/* M6 progressive enhancement: live list filtering that works with or
 * without a hydrated client. Filters rendered .result rows by their
 * visible text; updates the "showing x / y" counter if present.
 *
 * The filter stands down as soon as the Dioxus client mounts (its
 * nodes carry data-dioxus-id) — the Rust `oninput` signal then owns
 * the input, and this fallback would double-render. */
(function () {
  var mo = null;
  function clientMounted() {
    return !!(window.__dioxus || document.querySelector('#main [data-dioxus-id]'));
  }
  function stop() {
    if (mo) { mo.disconnect(); mo = null; }
  }
  function wire() {
    if (clientMounted()) { stop(); return; }
    const q = document.querySelector('input[name="q"]');
    if (!q || q.dataset.liveFilter) return;
    q.dataset.liveFilter = '1';
    const apply = function () {
      const needle = (q.value || '').trim().toLowerCase();
      const rows = document.querySelectorAll('.result');
      let shown = 0;
      rows.forEach(function (row) {
        const text = row.textContent.toLowerCase();
        const hit = !needle || text.indexOf(needle) !== -1;
        row.style.display = hit ? '' : 'none';
        if (hit) shown++;
      });
      document.querySelectorAll('.mono-sm').forEach(function (el) {
        if (/^\d+ \/ \d+$/.test(el.textContent.trim()) && rows.length) {
          el.textContent = shown + ' / ' + rows.length;
        }
      });
    };
    q.addEventListener('input', apply);
    q.addEventListener('change', apply);
    apply();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wire);
  } else { wire(); }
  // Re-wire after navigations render new lists; stop once the
  // Dioxus client takes over the DOM.
  if (!clientMounted()) {
    mo = new MutationObserver(function () { wire(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script>
/* M6/UI-1 progressive enhancement: command palette fallback.
 *
 * Runs only while the Dioxus client is NOT mounted (SSR-only build).
 * The corpus is the resource list rendered in the DOM (.result rows
 * on the files page), rebuilt as proper .palette-hit markup with a
 * kind badge, title and ref. Arrow keys move selection, Enter
 * navigates, Escape closes — keyboard flow works end to end.
 *
 * When the Dioxus client mounts (nodes carry data-dioxus-id) the
 * fallback stops: the Rust palette owns search + keyboard handling
 * and this script would double-render. */
(function () {
  var mo = null;
  function clientMounted() {
    return !!(window.__dioxus || document.querySelector('#main [data-dioxus-id]'));
  }
  function stop() {
    if (mo) { mo.disconnect(); mo = null; }
  }
  function corpus() {
    // Each .result row: the visible title link, kind class, ref text.
    return Array.from(document.querySelectorAll('.result')).map(function (row) {
      var titleEl = row.querySelector('.col-title a');
      var link = titleEl || row.querySelector('a[href]');
      var kindEl = row.querySelector('.kind');
      var kindMatch = kindEl && (kindEl.className.match(/kind-(\w+)/) || [])[1];
      var refEl = row.querySelector('.col-ref');
      return {
        href: link ? link.getAttribute('href') : null,
        title: titleEl ? (titleEl.textContent || '').trim() : (link ? (link.textContent || '').trim() : ''),
        kind: kindMatch || 'document',
        ref: refEl ? (refEl.textContent || '').trim() : ''
      };
    });
  }
  function visibleHits() {
    const needle = (input.value || '').trim().toLowerCase();
    return corpus().filter(function (h) {
      return h.href && (!needle || (h.title + ' ' + h.ref).toLowerCase().indexOf(needle) !== -1);
    });
  }
  var input = null;
  function render() {
    if (!input) return;
    const results = document.querySelector('.palette-results');
    if (!results) return;
    const hits = visibleHits();
    selected = Math.max(0, Math.min(selected, hits.length - 1));
    results.replaceChildren();
    if (!(input.value || '').trim()) {
      const empty = document.createElement('p');
      empty.className = 'palette-empty';
      empty.textContent = 'type to search this space.';
      results.append(empty);
      return;
    }
    if (!hits.length) {
      const empty = document.createElement('p');
      empty.className = 'palette-empty';
      empty.textContent = 'no matches.';
      results.append(empty);
      return;
    }
    const list = document.createElement('ul');
    list.className = 'palette-list';
    hits.forEach(function (hit, index) {
      const item = document.createElement('li');
      item.className = index === selected ? 'palette-hit palette-hit-selected' : 'palette-hit';
      const a = document.createElement('a');
      a.className = 'palette-hit-link';
      a.href = hit.href;
      const head = document.createElement('div');
      head.className = 'palette-hit-head';
      const kind = document.createElement('span');
      kind.className = 'palette-hit-kind kind-' + hit.kind;
      kind.textContent = hit.kind;
      const title = document.createElement('span');
      title.className = 'palette-hit-title';
      title.textContent = hit.title;
      head.append(kind, title);
      const loc = document.createElement('div');
      loc.className = 'palette-hit-loc mono-sm';
      loc.textContent = hit.ref;
      a.append(head, loc);
      item.append(a);
      list.append(item);
    });
    results.append(list);
  }
  var selected = 0;
  function wirePalette() {
    if (clientMounted()) { stop(); return; }
    input = document.querySelector('.palette-input');
    if (!input || input.dataset.livePalette) return;
    input.dataset.livePalette = '1';
    input.addEventListener('input', function () { selected = 0; render(); });
    input.addEventListener('keydown', function (event) {
      const hits = visibleHits();
      if (event.key === 'ArrowDown' && hits.length) {
        event.preventDefault(); selected = (selected + 1) % hits.length; render();
      } else if (event.key === 'ArrowUp' && hits.length) {
        event.preventDefault(); selected = (selected + hits.length - 1) % hits.length; render();
      } else if (event.key === 'Enter') {
        if (hits[selected] && hits[selected].href) {
          event.preventDefault();
          window.location.href = hits[selected].href;
        }
      } else if (event.key === 'Escape') {
        const close = document.querySelector('.palette-close');
        if (close) close.click();
      }
    });
    render();
  }

  wirePalette();
  if (!clientMounted()) {
    mo = new MutationObserver(function () { wirePalette(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script>
/* UI-1: document editor draft + save state (SSR-only fallback).
 *
 * - The draft textarea value is mirrored to sessionStorage keyed by
 *   ref_str on every input and on submit.
 * - After a failed save (redirect carries `edit_err`), the draft is
 *   restored into the textarea and the save state reads "Unsaved
 *   changes"; the stale-revision banner explains the conflict.
 * - After a successful save (`edited=1`) the draft is cleared.
 * - The visible save state is text ("Saved" / "Unsaved changes"),
 *   never colour alone, and updates both the header and the editor.
 *
 * Stands down when the Dioxus client mounts (data-dioxus-id) — the
 * Rust handlers then own the editor state. */
(function () {
  var mo = null;
  function clientMounted() {
    return !!(window.__dioxus || document.querySelector('#main [data-dioxus-id]'));
  }
  function stop() {
    if (mo) { mo.disconnect(); mo = null; }
  }
  function draftKey(ref) { return 'notez-draft:' + ref; }
  function syncSaveState(form) {
    if (!form) return;
    var ta = form.querySelector('textarea[name="content"]');
    var dirty = ta && ta.value !== ta.defaultValue;
    document.querySelectorAll('[data-save-state]').forEach(function (el) {
      el.textContent = dirty ? 'Unsaved changes' : 'Saved';
      el.classList.toggle('is-dirty', dirty);
    });
    var note = form.querySelector('.editor-draft-note');
    if (note) note.hidden = !dirty;
  }
  function wireEditor() {
    if (clientMounted()) { stop(); return; }
    var form = document.querySelector('.doc-edit-form');
    if (!form || form.dataset.editorWired) return;
    form.dataset.editorWired = '1';
    var ta = form.querySelector('textarea[name="content"]');
    var key = form.getAttribute('data-draft-key') || '';
    var params = new URLSearchParams(window.location.search);
    var draft = null;
    try { draft = sessionStorage.getItem(draftKey(key)); } catch (e) {}
    if (params.get('edit_err') && draft) {
      ta.value = draft;
      var note = form.querySelector('.editor-draft-note');
      if (note) { note.textContent = 'draft restored — review before saving'; note.hidden = false; }
    } else if (params.get('edited') === '1') {
      try { sessionStorage.removeItem(draftKey(key)); } catch (e) {}
    }
    ta.addEventListener('input', function () {
      try { sessionStorage.setItem(draftKey(key), ta.value); } catch (e) {}
      syncSaveState(form);
    });
    form.addEventListener('submit', function () {
      try { sessionStorage.setItem(draftKey(key), ta.value); } catch (e) {}
    });
    syncSaveState(form);
  }
  function wireModes() {
    if (clientMounted()) return;
    var modes = document.querySelector('.doc-modes');
    if (!modes || modes.dataset.modesWired) return;
    modes.dataset.modesWired = '1';
    modes.querySelectorAll('.doc-mode-tab').forEach(function (label) {
      label.addEventListener('click', function () {
        var id = label.getAttribute('for');
        var ta = modes.querySelector('textarea[name="content"]');
        if (ta && (id === 'doc-mode-edit' || id === 'doc-mode-source')) {
          // Keyboard users land directly in the editor.
          setTimeout(function () { ta.focus(); }, 0);
        }
      });
    });
  }
  function wireAll() {
    wireEditor();
    wireModes();
  }
  wireAll();
  if (!clientMounted()) {
    mo = new MutationObserver(function () { wireAll(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
