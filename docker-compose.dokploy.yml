# Dokploy deployment: notez web SSR behind Traefik with authentik
# forward-auth guarding every browser route.
#
# Deploy in dokploy as a Compose service (git source, this file):
#   * middleware `authentik-auth@file` is already defined in dokploy's
#     global Traefik config (forwardAuth -> authentik embedded outpost);
#     attach it to the notez domain via the dokploy domain settings.
#   * environment (Service > Environment):
#       NOTEZ_API_OIDC_ISSUER   https://auth.lszio.space/application/o/<provider-slug>/
#       NOTEZ_API_OIDC_AUDIENCE authentik provider client id
#     Left empty, the container crash-loops: the app refuses a public
#     bind without auth config (crates/api/src/config.rs).
#
# Browser traffic: Traefik forward-auth redirects unauthenticated users
# to authentik, then forwards identity headers. Machine clients keep
# hitting /api/v1 and /mcp with `Authorization: Bearer <jwt>`; the app
# validates those itself against the authentik JWKS (NOTEZ_API_OIDC_*),
# so API auth does not depend on the proxy.
#
# /api/v1/healthz stays public on both layers (Traefik router + app).

services:
  web:
    build: .
    image: notez-web:latest
    networks: [dokploy-network]
    environment:
      IP: 0.0.0.0
      PORT: "3030"
      NOTEZ_MODE: web
      # Auth is enforced by the app itself: ServerConfig::from_env refuses
      # a public bind with empty issuer/audience (container crash-loops
      # with a clear log until real values are set). Empty defaults keep
      # dokploy's compose parsing happy before env injection exists.
      NOTEZ_API_OIDC_ISSUER: ${NOTEZ_API_OIDC_ISSUER:-}
      NOTEZ_API_OIDC_AUDIENCE: ${NOTEZ_API_OIDC_AUDIENCE:-}
      # Optional: pin the default space root (persisted in the volume).
      NOTEZ_SPACE_ROOT: ${NOTEZ_SPACE_ROOT:-/data/space}
    # dokploy derives the Traefik router's backend port from this
    # declaration; without it the domain router is silently skipped.
    expose:
      - "3030"
    volumes:
      - notez-data:/data
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  notez-data:
