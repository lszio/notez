[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/composition",
    "crates/adapters/orgmode",
    "crates/protocol",
    "crates/preview",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/ui",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
schemars = { version = "1.0", features = ["chrono04"] }
dioxus = { version = "0.7.10" }

ui = { path = "packages/ui" }
